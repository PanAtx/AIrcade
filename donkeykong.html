/* ===== 3D SYNC ===== */
function sync3d(dt){
  if(!D3||!P)return;
  var t=time;
  /* --- Mario --- */
  if(D3.mario){
    var py3=playerScreenY();
    /* sink 4px so the feet overlap the visible platform surface and he
       looks like he's walking on it, not floating above it */
    /* Mario's shoes sit ~0.3 above his root, so -0.8 puts his feet just ABOVE
       the top of the top metal bar (gy-0.5): he stands ON TOP of the girder,
       not inside the bar above the X lattice */
    D3.mario.position.set(D3.to3d(P.x,py3).x,D3.to3d(0,py3).y-0.8,D3.to3d(P.x,py3).z);
    /* always keep Mario on the camera side of the girder/ladder plane:
       same screen position (ortho), but his feet read as being ON TOP of
       the truss instead of sinking into it when he stands */
    var mvw=D3.camera.position.clone().normalize();
    D3.mario.position.addScaledVector(mvw,14);
    /* correct profile: running LEFT shows his face pointing left, running
       RIGHT points him right (nose/mustache/brim lead the way); on the
       ladder his back faces the player */
    /* stand with his back to the player after a ladder (climb or vaulted-over),
       otherwise profile; on PAULINE'S girder he faces THE PLAYER (front view) -
       reaching her is a face-to-face moment; ease the turn so it reads as him
       stepping around */
    var tRY=(P.mode==='climb'||marioBack)?Math.PI:(P.face<0?-Math.PI/2:Math.PI/2);
    if(P.mode!=='climb'&&P.floor===6)tRY=0;   /* Pauline's girder: face the player */
    var dA=tRY-D3.mario.rotation.y;
    D3.mario.rotation.y+=Math.atan2(Math.sin(dA),Math.cos(dA))*Math.min(1,dt*10);
    var mU=D3.mario.userData;
    /* the swing axis that reads "bipedal on screen" depends on the view:
       side view (walking/jumping, rotation.y=±90°) -> limbs swing around the
       local X axis (plane of the screen); back view (ladder, rotation.y=180°)
       -> they swing around the local Z axis (side-to-side on the rungs).
       Ease out the axis that ISN'T driving the limbs this frame so switching
       between views never leaves a limb stuck at an odd angle. */
    if(P.mode==='climb'){
      mU.legL.rotation.x*=0.7;mU.legR.rotation.x*=0.7;
      mU.armL.rotation.x*=0.7;mU.armR.rotation.x*=0.7;
      D3.mario.rotation.x=0;
    }else{
      mU.legL.rotation.z*=0.7;mU.legR.rotation.z*=0.7;
      mU.armL.rotation.z*=0.7;mU.armR.rotation.z*=0.7;
      if(P.mode!=='topclimb')D3.mario.rotation.x=0;
      D3.mario.rotation.z=0;
    }
    if(P.mode==='ground'){
      if(P.moving){
        var s=Math.sin(P.walk*2);
        if(P.floor===6){
          /* facing the player: swing the limbs side-to-side (local Z) so the
             walk still reads as a walk from the front, not forward/back pumps */
          mU.legL.rotation.z=s*0.55;mU.legR.rotation.z=-s*0.55;
          mU.armL.rotation.z=-s*0.75;mU.armR.rotation.z=s*0.75;
        }else{
          mU.legL.rotation.x=s*0.7;mU.legR.rotation.x=-s*0.7;
          mU.armL.rotation.x=-s*0.9;mU.armR.rotation.x=s*0.9;
        }
      }else{
        mU.legL.rotation.x*=0.8;mU.legR.rotation.x*=0.8;
        mU.armL.rotation.x*=0.8;mU.armR.rotation.x*=0.8;
      }
      if(P.slipT>0){
        /* banana slip: leaning back, legs flailing, arms up in the air */
        var sfl=Math.sin(time*16);
        D3.mario.rotation.z=-P.slipDir*0.45+sfl*0.08;
        mU.legL.rotation.x=1.0+sfl*0.9;
        mU.legR.rotation.x=0.3-sfl*0.9;
        mU.armL.rotation.x=2.5+sfl*0.3;
        mU.armR.rotation.x=-2.5-sfl*0.3;
      }
      if(state==='WIN'){
        /* victory: hop and throw the arms up */
        D3.mario.position.y+=Math.abs(Math.sin(time*5))*4;
        mU.armL.rotation.z=2.3;mU.armR.rotation.z=-2.3;
      }
      if(hammerHeld){
        var liftH=0.5-0.5*Math.cos(time*9);       /* 1 = hammer up over the head, 0 = hammer down (impact) */
         mU.hammer.visible=(hammerTime>2.5)||(Math.floor(time*10)%2===0); /* blink as the time runs out */
        mU.armR.rotation.x=(Math.PI+0.35)*(1-liftH); /* hammer head: UP over head -> FORWARD (the way he faces) -> DOWN: sweeps the front side */
        var near=liftH<0.15;
         if(near&&!hamImpactPrev)mU.hammer.rotation.x=Math.random()*1.6-0.8; /* impact jolt */
         hamImpactPrev=near;
         D3.mario.position.y-=1.6*(1-liftH)*(1-liftH);    /* little dip into each slam */
        mU.armL.rotation.x=0.4;
      }else{
        mU.hammer.visible=false;
        mU.hammer.rotation.x=0;
         hamImpactPrev=false;
      }
      D3.mario.visible=true;
    }else if(P.mode==='climb'){
      /* back view: the z-swing IS the side-to-side rung alternation the
         player sees, which is exactly how ladder climbing should look */
      mU.hammer.visible=false;
      if(P.moving){
        var c=Math.sin(t*14);
        mU.legL.rotation.z=c*0.8;mU.legR.rotation.z=-c*0.8;
        mU.armL.rotation.z=-c*0.8;mU.armR.rotation.z=c*0.8;
      }else{
        mU.legL.rotation.z*=0.8;mU.legR.rotation.z*=0.8;
        mU.armL.rotation.z*=0.8;mU.armR.rotation.z*=0.8;
      }
      D3.mario.visible=true;
    }else if(P.mode==='topclimb'){
      /* climb over the girder the real way: front leg up and OVER the bar,
         arms grab hold, second leg comes over, then push up and stand.
         side view, so the swing is around local X (~2.2 rad puts the foot
         above the hips, i.e. over the girder) */
      mU.hammer.visible=false;
      var pv=P.popT;
      function vseg(a,b){return smooth01(Math.max(0,Math.min(1,(pv-a)/(b-a))));}
      var leg1=vseg(0.02,0.26);   /* front leg swings up over the bar    */
      var leg2=vseg(0.26,0.48);   /* second leg comes over the bar       */
      var st=vseg(0.52,0.72);     /* push up -> settle to standing pose  */
      var hold=1-st;              /* limbs relaxed while gripping        */
      mU.legR.rotation.x=2.25*leg1*hold;                    /* front leg over, then down */
      mU.legL.rotation.x=2.25*leg2*hold-0.5*(1-leg2);       /* back leg: braced, then over */
      mU.armR.rotation.x=-(2.4+0.3*(leg1-leg2))*hold;       /* gripping arm reaches OUT FRONT (+z) */
      mU.armL.rotation.x=-(2.4-0.3*(leg1-leg2))*hold;       /* other arm reaches over too */
      D3.mario.rotation.x=0.16*hold*(leg1>0.4||leg2>0.4);   /* slight lean into the vault */
      D3.mario.visible=true;
    }else if(P.mode==='jump'){
      mU.legL.rotation.x=0.9;mU.legR.rotation.x=-0.5;
      mU.armL.rotation.x=2.4;mU.armR.rotation.x=2.4;
      D3.mario.visible=true;
    }else if(P.mode==='fall'){
      mU.legL.rotation.x=0.5;mU.legR.rotation.x=-0.3;
      mU.armL.rotation.x=2.2;mU.armR.rotation.x=-2.2;
      D3.mario.visible=true;
    }else{
      D3.mario.visible=false; /* dead */
    }
    /* hurt flash: while invulnerable after losing a heart, Mario blinks out of frame */
    if(P.hurtT>0&&D3.mario.visible)D3.mario.visible=(Math.floor(t*12)%2===0);
  }
  /* --- DK (bouncing on top) --- */
  if(D3.dk){
    var stg=(state==='STAGECLEAR'||state==='INTRO'),si=stg?((state==='STAGECLEAR')?scInfo(scT):introInfo(introT)):null;
    D3.dk.position.copy(D3.to3d(stg?si.dkx:DKPOS.x,stg?si.dky-si.hop:gy(GIRDS[5],DKPOS.x)));
    var bounce=(state==='PLAYING')?(Math.abs(Math.sin(t*2.2))*4):Math.sin(t*1.4)*1.5;
    if(state==='PLAYING'&&dkAnim!=='idle')bounce*=0.3; /* steady stance while throwing */
    if(stg)bounce=0; /* his own moves drive the stage-clear cutscene */
    D3.dk.position.y+=bounce;
    var dU=D3.dk.userData;
    dU.dkHam.visible=false;
    if(state!=='WIN')D3.dk.rotation.z*=0.8;   /* shed any tumble left over from the win cutscene */
    /* DK barrel-throw: turns left -> grabs a barrel off the stack -> turns
       right -> rolls it down the girder with his arm, then settles back */
    if(state==='PLAYING'&&dkAnim!=='idle'){
      if(dkAnim==='turnL'){
        var kl=smooth01(Math.min(1,dkAnimT/DK_ANIM.turnL));
        D3.dk.rotation.y=-1.25*kl;                        /* face the stacks */
        dU.armL.rotation.z=0.25-1.1*kl;
      }else if(dkAnim==='grab'){
        var kg=smooth01(Math.min(1,dkAnimT/(DK_ANIM.grab*0.7)));
        D3.dk.rotation.y=-1.25;
        dU.armL.rotation.z=-0.85-1.05*kg;                 /* reach out to the stack */
      }else if(dkAnim==='turnR'){
        var kr=smooth01(Math.min(1,dkAnimT/DK_ANIM.turnR));
        D3.dk.rotation.y=-1.25+2.5*kr;                    /* swing around to face right */
        dU.armL.rotation.z=-1.9+2.15*kr;                  /* carrying arm relaxes */
        dU.armR.rotation.z=-0.25+1.9*kr;                  /* arm swings out to the right */
      }else{
        var kk=smooth01(Math.min(1,dkAnimT/DK_ANIM.roll));
        D3.dk.rotation.y=1.25*(1-kk);                     /* settle back to facing the player */
        dU.armR.rotation.z=1.65;                          /* pushing the barrel down the girder */
      }
    }else{
      D3.dk.rotation.y+=(0-D3.dk.rotation.y)*Math.min(1,dt*6);
      /* ease the arms back to the idle bob (no pose pop after a throw) */
      var armLidle=0.25+Math.sin(t*2.2)*0.15,armRidle=-0.25-Math.sin(t*2.2)*0.15;
      dU.armL.rotation.z+=(armLidle-dU.armL.rotation.z)*Math.min(1,dt*8);
      dU.armR.rotation.z+=(armRidle-dU.armR.rotation.z)*Math.min(1,dt*8);
    }
    /* STAGE CLEAR cutscene poses: angry -> walk -> climb -> grab -> carry -> stomp x3 */
    if(stg){
      var dP=si.phase;
      if(dP==='angry'){
        D3.dk.position.y+=Math.abs(Math.sin(t*10))*1.5;    /* pacing his rage */
        dU.armL.rotation.z=2.6+Math.sin(t*13)*0.3;
        dU.armR.rotation.z=-2.6-Math.sin(t*13)*0.3;
      }else if(dP==='walk'){
        D3.dk.position.y+=Math.abs(Math.sin(t*9))*1.2;
        dU.armL.rotation.z=0.35*Math.sin(t*9);
        dU.armR.rotation.z=-0.35*Math.sin(t*9);
      }else if(dP==='climb'){
        var clv=Math.sin(t*12);
        dU.armL.rotation.z=2.6;dU.armR.rotation.z=-2.6;    /* arms up on the rails */
        if(dU.legL){dU.legL.rotation.z=clv*0.85;dU.legR.rotation.z=-clv*0.85;}
      }else if(dP==='grab'){
        var kgv=(scT-SC_T.walkBEnd)/Math.max(0.001,SC_T.grabEnd-SC_T.walkBEnd);
        dU.armL.rotation.z=-1.3+2.9*kgv;                   /* reach down, then scoop her up */
        dU.armR.rotation.z=1.3-2.9*kgv;
      }else if(dP==='carry'){
        dU.armR.rotation.z=-2.9;                            /* Pauline held up on his right */
        dU.armL.rotation.z=0.5+0.3*Math.sin(t*10);
      }else if(dP==='settle'){
        dU.armL.rotation.z+=(0.3-dU.armL.rotation.z)*Math.min(1,dt*8);
        dU.armR.rotation.z+=(-0.3-dU.armR.rotation.z)*Math.min(1,dt*8);
      }else{
        var sa=si.hop/12;                                   /* arms follow the stomp */
        dU.armL.rotation.z=0.4+2.3*sa;
        dU.armR.rotation.z=-0.4-2.3*sa;
        dU.body.scale.set(1+0.09*(1-sa),1-0.13*(1-sa),1+0.09*(1-sa)); /* squash on landing */
      }
      if(dP!=='climb'&&dU.legL){dU.legL.rotation.z*=0.82;dU.legR.rotation.z*=0.82;}
      if(dP!=='stomp'&&dU.body)dU.body.scale.set(1,1,1);
      var ryv=(dP==='walk'||dP==='carry')?0.85:(dP==='grab'||dP==='climb')?0.4:0;
      D3.dk.rotation.y+=(ryv-D3.dk.rotation.y)*Math.min(1,dt*7);
    }else if(dU.body){dU.body.scale.set(1,1,1);}
    if(D3.dkBarrel){
      D3.dkBarrel.visible=dkHold.visible;
      if(dkHold.visible){
        /* barrel spinning as DK rolls it: angle from actual travel (angle = dist / radius) */
        var dhx=dkHold.x-(dkHold.px===undefined?dkHold.x:dkHold.px);
        dkHold.px=dkHold.x;
        D3.dkBarrel.position.copy(D3.to3d(dkHold.x,dkHold.y));
        D3.dkBarrel.rotation.z-=dhx/BR;                   /* clockwise when rolling right */
      }
    }
    /* intermission: DK climbs down a ladder with a hammer, then back up */
    if(state==='INTERM'){
      var ip=stateT/6; if(ip<0)ip=0; if(ip>1)ip=1;
      var lx=360;                                  /* f4-f5 working ladder column (right side) */
      var topY=gy(GIRDS[5],lx),botY=gy(GIRDS[4],lx);
      var ly=(ip<0.5)?(topY+(botY-topY)*(ip/0.5)):(botY-(botY-topY)*((ip-0.5)/0.5));
      D3.dk.position.copy(D3.to3d(lx,ly));
      dU.dkHam.visible=true;
      if(Math.random()<dt*2)dU.dkHam.rotation.x=Math.random()*6;
      dU.armR.rotation.z=2.5;
    }
    /* VICTORY: DK tumbles off the building and lands knocked out cold */
    if(state==='WIN'){
      var wi=winInfo(stateT);
      D3.dk.position.copy(D3.to3d(wi.dkx,wi.dky));
      D3.dk.rotation.y=0;
      D3.dk.rotation.z+=(wi.rot-D3.dk.rotation.z)*Math.min(1,dt*14);
      dU.dkHam.visible=false;
      if(wi.lying){
        dU.armL.rotation.z=1.1;dU.armR.rotation.z=-1.1;
        if(dU.legL){dU.legL.rotation.z=0.8;dU.legR.rotation.z=-0.8;}
        if(dU.body)dU.body.scale.set(1,0.9,1);
      }
    }
  }
  /* --- Pauline (waving) --- */
  if(D3.pauline){
    var pi=(state==='STAGECLEAR')?scInfo(scT):(state==='WIN')?winInfo(stateT):(state==='INTRO')?introInfo(introT):null;
    var pxi2=pi?pi.px:PAULINE.x,pyi2=pi?pi.py:gy(GIRDS[6],PAULINE.x);
    D3.pauline.position.copy(D3.to3d(pxi2,pyi2));
    if(state==='WIN')D3.pauline.position.y+=Math.abs(Math.sin(t*6))*3;   /* happy victory hops */
    if(pi){
      /* carried: she flails in panic; set down: waves from the top girder */
      D3.pauline.userData.arm.rotation.z=pi.carry?1.9+Math.sin(t*11)*0.7:Math.sin(t*3)*0.7+0.6;
    }else{
      D3.pauline.userData.arm.rotation.z=Math.sin(t*3)*0.7+0.6;
      if(state==='PLAYING'&&Math.random()<dt*0.05){
        /* little panic hop */
        D3.pauline.position.y+=2;
      }
    }
  }
  /* --- barrels (pooled) --- */
  if(D3.barrelPool){
    var pool=D3.barrelPool,nb=barrels.length;
    for(var i=0;i<pool.length;i++){
      if(i<nb){
        var b=barrels[i];
        pool[i].visible=true;
        pool[i].position.copy(D3.to3d(b.x,b.sy));
        /* rolling: spin angle is driven by the actual distance travelled
           (no-slip: angle = distance / radius) so it matches roll speed */
        if(b.rot===undefined)b.rot=0;
        pool[i].children[0].rotation.z=b.rot;
        pool[i].children[0].material=(b.blue)?D3.blueMat:pool[i].userData.mat; /* blue barrel = same wood + flammable-liquid sign */
      }else{
        pool[i].visible=false;
      }
    }
  }
  /* --- monkeys (pooled: hop, 4-leg trot, tail wag, FACES THE WALK DIRECTION) --- */
  if(D3.monkeyPool){
    var mp=D3.monkeyPool;
    for(var mi=0;mi<mp.length;mi++){
      if(mi<monkeys.length){
        var mk=monkeys[mi];
        if(mk.dead){mp[mi].visible=false;continue;}
        mp[mi].visible=true;
        var hop=Math.abs(Math.sin(mk.ph))*3;
        mp[mi].position.copy(D3.to3d(mk.x,(mk.sy!=null)?mk.sy:gy(GIRDS[mk.floor],mk.x)));
        mp[mi].position.y+=hop;
        /* model front is local +z (Mario's convention): +PI/2 faces screen-right,
           -PI/2 faces screen-left. Ease the turn so it rotates, not snaps,
           when it switches girders and reverses. */
        var md=(GIRDS[mk.floor].dir||-1);
        var mRY=(md>0)?Math.PI/2:-Math.PI/2;
        if(mk.mRY===undefined)mk.mRY=mRY;
        var mDA=mRY-mk.mRY;
        mk.mRY+=Math.atan2(Math.sin(mDA),Math.cos(mDA))*Math.min(1,dt*10);
        mp[mi].rotation.y=mk.mRY;
        var mU=mp[mi].userData;
        /* diagonal 4-leg trot: front-left + rear-right swing together
           (swing axis is local X since the front is local +z) */
        var sw=Math.sin(mk.ph)*0.7;
        mU.legL.rotation.x=sw;
        mU.legR.rotation.x=-sw;
        mU.legFR.rotation.x=-sw;
        mU.legBL.rotation.x=sw;
        /* cute tail wag + a little head bob */
        if(mU.tail)mU.tail.rotation.y=Math.sin(mk.ph*0.5)*0.35;
        if(mU.head)mU.head.rotation.x=Math.sin(mk.ph)*0.06;
      }else{
        mp[mi].visible=false;
      }
    }
  }
  /* --- hammers (each hidden once grabbed; stays gone until the level restarts) + oil flames --- */
  if(D3.hamLs){
    for(var hui=0;hui<D3.hamLs.length;hui++){
      var hH=D3.hamLs[hui];
      if(hH.ref.taken){
        hH.grp.visible=false;
      }else{
        hH.grp.visible=true;
        hH.grp.position.y=hH.baseY+Math.sin(t*2.4+hui*1.7)*2;
      }
    }
  }
  if(D3.flames){
    for(var fli=0;fli<D3.flames.length;fli++){
      var fl=D3.flames[fli];
      var on=(oilFx>0)?1:0.45;
      fl.scale.set(on*(1+Math.sin(t*11+fli)*0.18),on*(1+Math.cos(t*9+fli*2)*0.22),on);
    }
  }
  /* --- living fires (up to MAX_FLAMES at once - level 5; every tip flickers) --- */
  if(D3.firePool){
    for(var fpq=0;fpq<D3.firePool.length;fpq++){
      var fGq=D3.firePool[fpq];
      if(fpq<fires.length){
        var fq2=fires[fpq];
        var fy3=(fq2.sy==null)?gy(GIRDS[fq2.floor],fq2.x):fq2.sy;
        fGq.visible=true;
        fGq.position.copy(D3.to3d(fq2.x,fy3));
        /* the girder mesh is tilted by its pitch, but the flame group was left
           UPRIGHT - tilt the whole fire to the girder's angle (same formula as
           the girder mesh) so its base runs exactly along the top rail; ease
           upright while climbing a ladder. */
        var fG=(fq2.sy==null)?GIRDS[fq2.floor]:null;
        var fAng=(fG&&fG.dir>0)?-Math.atan(PITCH):(fG&&fG.dir<0?Math.atan(PITCH):0);
        var fDA=fAng-fGq.rotation.z;
        fGq.rotation.z+=Math.atan2(Math.sin(fDA),Math.cos(fDA))*Math.min(1,dt*10);
        var fTps=D3.fireTipsPool[fpq];
        for(var ft=0;ft<fTps.length;ft++){
          var tp=fTps[ft];
          /* raging flicker: fast + slow sines stacked, each tip out of phase */
          var fl=0.78+0.24*Math.sin(t*16+tp.ph)+0.14*Math.sin(t*29+tp.ph*1.7);
          tp.m.scale.set(1+0.14*Math.sin(t*23+tp.ph),Math.max(0.45,fl),1);
          tp.m.position.x=tp.x+1.8*Math.sin(t*11+tp.ph*2.3);   /* tips sway like wind */
          tp.m.rotation.z=0.22*Math.sin(t*9.5+tp.ph);
          tp.mat.emissiveIntensity=0.85+0.5*(0.5+0.5*Math.sin(t*19+tp.ph*3.1)); /* glow pulses */
        }
      }else{
        fGq.visible=false;
      }
    }
  }
  /* --- bananas (slip traps) --- */
  if(D3.bananaPool){
    for(var bpq=0;bpq<D3.bananaPool.length;bpq++){
      var bbq=D3.bananaPool[bpq];
      if(bpq<bananas.length){
        var bq2=bananas[bpq];
        var byy=(bq2.fy!=null)?bq2.fy:gy(GIRDS[bq2.floor],bq2.x);
        bbq.visible=true;
        bbq.position.copy(D3.to3d(bq2.x,byy));   /* base sits ON the girder */
        if(bq2.fy!=null){
          bbq.rotation.x=bq2.t*9;   /* tumble while falling */
          bbq.rotation.y=bq2.t*5;
        }else{
          bbq.rotation.x=0;
          bbq.rotation.y=t*1.8+bpq*0.7;   /* steady Y-axis spin while standing */
        }
      }else{
        bbq.visible=false;
      }
    }
  }
  /* --- WWI bi-planes: patrol high behind the building (King Kong overfly) --- */
  if(D3.planes){
    var plShow=(state!=='TITLE')&&((state!=='INTRO')||(introT>=INTRO_T.planeStart));
    for(var pji=0;pji<D3.planes.length;pji++){
      (function(pr){
        var d=pr.def,lt=time-d.delay;
        pr.grp.visible=plShow&&lt>=0;
        if(!pr.grp.visible)return;
        var span=W+160;
        var px=(W+80)-((lt*d.sp)%span);      /* right to left, nose facing left like the photo */
        var py=d.y+Math.sin(lt*1.6+d.ph)*3.5;
        var pv=D3.to3d(px,py);
        pv.addScaledVector(D3.camDir,-120);       /* BEHIND the girders */
        pr.grp.position.copy(pv);
        pr.grp.rotation.z=Math.sin(lt*1.6+d.ph)*0.07;   /* gentle bank into the bob */
        pr.grp.rotation.x=Math.sin(lt*0.8+d.ph)*0.05;
        pr.grp.rotation.y=Math.sin(lt*0.5+d.ph)*0.06;   /* subtle yaw wobble */
        pr.prop.rotation.x+=dt*42;                    /* rotary engine + prop */
      })(D3.planes[pji]);
    }
  }
  /* --- camera --- */
  var sh=shakeAmp*(0.5+Math.random());
  D3.camera.position.x=(Math.random()-0.5)*sh;
  D3.camera.position.y=42+(Math.random()-0.5)*sh;
  D3.camera.lookAt(0,0,0);
  D3.renderer.render(D3.scene,D3.camera);
}
/* ===== HUD + MAIN RENDER ===== */
function updateLives(){
  var el=document.getElementById('lives');
  el.innerHTML='';
  for(var i=0;i<Math.min(lives,6);i++){
    var sp=document.createElement('span');
    el.appendChild(sp);
  }
}
function updateHearts(){
  var el=document.getElementById('hearts');
  if(!el)return;
  el.innerHTML='';
  for(var i=0;i<MAX_HEARTS;i++){
    var s=document.createElement('span');
    s.textContent='\u2665';
    if(i>=hearts)s.className='off';
    el.appendChild(s);
  }
}
function updateHUD(){
  document.getElementById('score').textContent=String(score).padStart(6,'0');
  document.getElementById('high').textContent=String(Math.max(high,score)).padStart(6,'0');
  document.getElementById('level').textContent='L'+level;
  updateLives();
  updateHearts();
}
function render(dt){
  var g=ovCtx;
  g.clearRect(0,0,W,H);
  if(!D3&&state!=='TITLE'){
    /* no-WebGL fallback: 2D Camel silhouettes on the background canvas */
    var showPlanes=(state!=='INTRO')||(introT>=INTRO_T.planeStart);
    if(showPlanes){
      paintBG();
      drawPlanes();
    }
  }
  sync3d(dt);
  if(!D3)drawFallback(g);
  drawState(g);
  drawFX(g);
  updateHUD();
}
/* ===== MAIN LOOP ===== */
var lastTs=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!lastTs)lastTs=ts;
  var dt=(ts-lastTs)/1000;
  lastTs=ts;
  if(dt>0.05)dt=0.05;
  time+=dt;
  if(shakeAmp>0){
    shakeT-=dt;
    if(shakeT<=0){shakeAmp=0;}
  }
  if(actx)musicUpdate();
  pollGamepad();
  if(!paused)update(dt);
  render(dt);
}
requestAnimationFrame(frame);
/* ===== INPUT WIRING ===== */
function handleStartInput(){
  if(state==='TITLE'){
    initAudio();
    startFromTitle();
  }else if(state==='GAMEOVER'){
    if(stateT>0.5)resetGame();
  }else if(state==='INTERM'){
    skipInterm();
  }else if(state==='INTRO'){
    skipIntro();
  }else if(state==='WIN'){
    if(stateT>0.5)toTitle();   /* victory cutscene done -> back to title */
  }else if(paused){
    togglePause();
  }
}
window.addEventListener('keydown',function(e){
  var k=e.key;
  if(k==='ArrowLeft'||k==='a')input.left=true;
  else if(k==='ArrowRight'||k==='d')input.right=true;
  else if(k==='ArrowUp'||k==='w')input.up=true;
  else if(k==='ArrowDown'||k==='s')input.down=true;
  else if(k===' '||k==='z'||k==='x'||k==='Enter'){
    if(state==='PLAYING'){jumpQueued=true;if(!e.repeat)flashJump();}
    else handleStartInput();
  }
  else if(k==='p'||k==='P')togglePause();
  else if(k==='m'||k==='M')toggleMute();
  else if(k==='c'||k==='C'){toggleCheat();e.preventDefault();}
  else if(k==='r'||k==='R'){
    if(state!=='TITLE')resetGame();
  }
  else if(k==='l'||k==='L'){
    /* L = clear the current level (only while cheat mode is on) */
    if(cheatMode&&state==='PLAYING')levelClear();
  }
  else if(k==='f'||k==='F'){
    enterFullscreen();
  }
  else if(k==='Escape')return;
  else if(state==='TITLE'||state==='GAMEOVER'||state==='INTERM'||state==='INTRO'||state==='WIN'){
    handleStartInput();
  }
  if(k===' '||k.indexOf('Arrow')===0)e.preventDefault();
  /* mirror direction keys onto the virtual joystick */
  var kd=kbDirKey(k);
  if(kd){
    if(kbOrder.indexOf(kd)<0)kbOrder.push(kd);
    vSrc='kb';
    kbJoy();
  }
});
window.addEventListener('keyup',function(e){
  var k=e.key;
  var ku=kbDirKey(k);
  if(ku){
    var i=kbOrder.indexOf(ku);
    if(i>=0)kbOrder.splice(i,1);
    /* never stomp a direction the joystick / gamepad is still holding */
    releaseDir(ku);
    if(vSrc==='kb')kbJoy();
  }
});
/* --- direction arbitration: keyboard / gamepad / virtual joystick all
   coexist. A source may assert its direction freely, but may only CLEAR a
   direction if no other source is currently holding it. (Previously the
   per-frame gamepad poll clobbered input.* based on kbOrder alone, which
   silently killed the virtual joystick once a gamepad had been used.) --- */
var joyHeld=null;                        /* 'l'|'r'|'u'|'d'|null held by the stick */
var gpHeld={l:false,r:false,u:false,d:false};
function setDir(dir,v){
  if(dir==='l')input.left=v;
  else if(dir==='r')input.right=v;
  else if(dir==='u')input.up=v;
  else input.down=v;
}
function releaseDir(dir){
  if(kbOrder.indexOf(dir)>=0)return;
  if(gpHeld[dir])return;
  if(joyHeld===dir)return;
  setDir(dir,false);
}
/* --- joystick --- */
var joyId=null;
document.getElementById('joyBase').addEventListener('pointerdown',function(e){
  e.preventDefault();
  initAudio();
  try{this.setPointerCapture(e.pointerId);}catch(_){}
  joyId=e.pointerId;
  this.classList.add('active');
  joyMove(e);
});
document.getElementById('joyBase').addEventListener('pointermove',function(e){
  if(e.pointerId!==joyId)return;
  joyMove(e);
});
function joyEnd(e){
  if(e.pointerId!==joyId)return;
  joyId=null;
  /* only drop the direction the stick was holding, if nobody else holds it */
  var prev=joyHeld;
  joyHeld=null;
  if(prev)releaseDir(prev);
  document.getElementById('joyKnob').style.transform='translate(0px,0px)';
  document.getElementById('joyStick').style.transform='rotate(0deg) scaleY(0)';
  document.getElementById('joyBase').classList.remove('active');
}
document.getElementById('joyBase').addEventListener('pointerup',joyEnd);
document.getElementById('joyBase').addEventListener('pointercancel',joyEnd);
document.getElementById('joyBase').addEventListener('lostpointercapture',joyEnd);
function joyMove(e){
  var r=document.getElementById('joyBase').getBoundingClientRect();
  var kr=document.getElementById('joyKnob').getBoundingClientRect();
  var cx=r.left+r.width/2,cy=r.top+r.height/2;
  var max=r.width/2-(kr.width/2);
  var dx=e.clientX-cx,dy=e.clientY-cy,dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>max){var s=max/dist;dx*=s;dy*=s;dist=max;}
  document.getElementById('joyKnob').style.transform='translate('+dx+'px,'+dy+'px)';
  /* metal pole: points from base center toward the knob, stretches with distance */
  var ang=dist>0?Math.atan2(dy,dx)*180/Math.PI+90:0;
  document.getElementById('joyStick').style.transform='rotate('+ang+'deg) scaleY('+(dist/max)+')';
  /* only the dominant axis is acknowledged -> never a diagonal */
  var dz=max*0.25,hd=null;
  if(dist>=dz){
    if(Math.abs(dx)>=Math.abs(dy)){if(dx<0)hd='l';else hd='r';}
    else{if(dy<0)hd='u';else hd='d';}
  }
  /* the stick takes over the direction it points at (latest input wins),
     but never clobbers a direction the keyboard / gamepad still holds,
     and restores its previous direction when the stick moves off it */
  var prev=joyHeld;
  joyHeld=hd;
  if(prev&&prev!==hd)releaseDir(prev);
  if(hd)setDir(hd,true);
}
/* --- jump button --- */
var jb=document.getElementById('jumpBtn');
jb.addEventListener('pointerdown',function(e){
  e.preventDefault();
  initAudio();
  if(state==='PLAYING')jumpQueued=true;
  else handleStartInput();
  jb.classList.add('active');
});
jb.addEventListener('pointerup',function(){jb.classList.remove('active');});
jb.addEventListener('pointercancel',function(){jb.classList.remove('active');});
jb.addEventListener('contextmenu',function(e){e.preventDefault();});
/* --- jump button pressed-down visual (for keyboard / gamepad jump) --- */
var jbFlashT=null;
function flashJump(){
  jb.classList.add('active');
  if(jbFlashT)clearTimeout(jbFlashT);
  jbFlashT=setTimeout(function(){jb.classList.remove('active');jbFlashT=null;},180);
}
/* --- virtual joystick mirror: keyboard / gamepad input shown on the stick --- */
var kbOrder=[],vSrc=null;
function kbDirKey(k){
  if(k==='ArrowUp'||k==='w')return 'u';
  if(k==='ArrowDown'||k==='s')return 'd';
  if(k==='ArrowLeft'||k==='a')return 'l';
  if(k==='ArrowRight'||k==='d')return 'r';
  return null;
}
function kbDirFromKey(key){
  if(key==='r')return{x:1,y:0};
  if(key==='l')return{x:-1,y:0};
  if(key==='d')return{x:0,y:1};
  return{x:0,y:-1};
}
function kbJoy(){
  if(vSrc!=='kb'||joyId!==null)return;
  var key=kbOrder[kbOrder.length-1];
  joyShowDir(key?kbDirFromKey(key):null);
}
function joyShowDir(dir){
  if(joyId!==null)return;
  var knob=document.getElementById('joyKnob'),stick=document.getElementById('joyStick'),base=document.getElementById('joyBase');
  if(dir){
    base.classList.add('active');
    var r=base.getBoundingClientRect(),kr=knob.getBoundingClientRect();
    var max=r.width/2-(kr.width/2);
    var dx=dir.x*max*0.75,dy=dir.y*max*0.75;
    knob.style.transform='translate('+dx+'px,'+dy+'px)';
    var ang=Math.atan2(dy,dx)*180/Math.PI+90;
    stick.style.transform='rotate('+ang+'deg) scaleY(0.75)';
  }else{
    knob.style.transform='translate(0px,0px)';
    stick.style.transform='rotate(0deg) scaleY(0)';
    base.classList.remove('active');
  }
}
/* --- tap to start (outside buttons/joystick) --- */
var stage=document.getElementById('stage');
stage.addEventListener('pointerdown',function(e){
  if(e.target.closest('button')||e.target.closest('#joyBase'))return;
  initAudio();
  if(state==='TITLE')startFromTitle();
  else if(state==='INTERM')skipInterm();
  else if(state==='INTRO')skipIntro();
  else if(state==='GAMEOVER'&&stateT>0.5)resetGame();
  else if(state==='WIN'&&stateT>0.5)toTitle();
});
/* --- buttons --- */
function initAudio(){return ac();}
function togglePause(){
  if(state!=='PLAYING'&&state!=='READY')return;
  paused=!paused;
  var pb=document.getElementById('pauseBtn');
  pb.textContent=paused?'▶':'⏸';
  pb.className=paused?'active':'';
  if(actx){
    if(paused){musicMode('off');sfx.pause();}
    else if(state==='PLAYING')musicMode('play');
  }
}
function toggleMute(){
  muted=!muted;
  var mb=document.getElementById('muteBtn');
  mb.textContent=muted?'🔇':'🔊';
  mb.className=muted?'active':'';
}
document.getElementById('pauseBtn').addEventListener('click',function(){
  initAudio();
  togglePause();
});
document.getElementById('muteBtn').addEventListener('click',function(){
  initAudio();
  toggleMute();
});
document.getElementById('restartBtn').addEventListener('click',function(){
  initAudio();
  if(state==='TITLE')startFromTitle();
  else resetGame();
});
/* --- fullscreen (the WHOLE page goes fullscreen, not just #stage,
   so the title, HUD, joystick and buttons stay visible; the stage is
   sized with CSS so it keeps its 4:3 ratio and everything fits) --- */
function enterFullscreen(){
  var el=document.documentElement;
  var p=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
  if(p){try{var r=p.call(el);if(r&&r.catch)r.catch(function(){});}catch(e){}}
}
function exitFullscreen(){
  if(!(document.fullscreenElement||document.webkitFullscreenElement))return;
  var p=document.exitFullscreen||document.webkitExitFullscreen;
  if(p)try{p.call(document);}catch(e){}
}
/* 3D canvas resizes itself on window resize; fullscreen resize flows through it too */
/* --- gamepad --- */
var gpPrev={jump:false,up:false,down:false,pause:false,mute:false};
/* This machine can enumerate SEVERAL gamepads at once (e.g. a Razer "Unknown
   Gamepad" AND a "STANDARD GAMEPAD"). Reading only the first slot left the
   pad the player actually holds completely dead, so MERGE every connected
   pad into one virtual pad: union of pressed buttons, max-magnitude axes. */
function mergedGamepad(){
  var pads=null;
  try{pads=navigator.getGamepads?navigator.getGamepads():null;}catch(err){return null;}
  if(!pads)return null;
  var any=false,nBtn=0,pressed={},axes=[];
  for(var i=0;i<pads.length;i++){
    var p=pads[i];
    if(!p||!p.connected)continue;
    var pb=p.buttons||[],pa=p.axes||[];
    if(pb.length||pa.length)any=true;
    if(pb.length>nBtn)nBtn=pb.length;
    for(var bi=0;bi<pb.length;bi++){if(pb[bi]&&(pb[bi].pressed||(pb[bi].value||0)>0.5))pressed[bi]=true;}
    for(var ai=0;ai<pa.length;ai++){var v=pa[ai]||0;if(Math.abs(v)>Math.abs(axes[ai]||0))axes[ai]=v;}
  }
  if(!any)return null;
  var buttons=[];
  for(var k=0;k<nBtn;k++)buttons.push({pressed:!!pressed[k],value:pressed[k]?1:0});
  return{connected:true,axes:axes,buttons:buttons};
}
function pollGamepad(){
  var gp=mergedGamepad();
  if(!gp){gpHeld.l=gpHeld.r=gpHeld.u=gpHeld.d=false;if(vSrc==='gp')joyShowDir(null);return;}
  var ax=gp.axes[0]||0,ay=gp.axes[1]||0;
  var btn=function(i){return gp.buttons[i]&&gp.buttons[i].pressed;};
  var gl=ax<-0.4||btn(14);  /* stick left OR D-pad left */
  var gr=ax>0.4||btn(15);   /* stick right OR D-pad right */
  var up=btn(12)||ay<-0.4;
  var down=btn(13)||ay>0.4;
  /* D-pad up/down must drive the input the same way the stick does
     (previously these were only used to queue jumps, so Mario could
     never climb/descend ladders from the gamepad) */
  /* the gamepad asserts its own directions, but must never stomp a
     direction the keyboard OR the virtual joystick is currently holding */
  if(gl){input.left=true;}
  else if(kbOrder.indexOf('l')<0&&joyHeld!=='l')input.left=false;
  if(gr){input.right=true;}
  else if(kbOrder.indexOf('r')<0&&joyHeld!=='r')input.right=false;
  if(up){input.up=true;}
  else if(kbOrder.indexOf('u')<0&&joyHeld!=='u')input.up=false;
  if(down){input.down=true;}
  else if(kbOrder.indexOf('d')<0&&joyHeld!=='d')input.down=false;
  gpHeld.l=!!gl;gpHeld.r=!!gr;gpHeld.u=!!up;gpHeld.d=!!down;
  var jump=btn(0)||btn(2)||btn(5);
  /* NOTE: D-pad / stick up-down must NOT queue a jump - they only climb,
     matching the keyboard and virtual joystick. Jump is A / X / B. */
  if(jump&&!gpPrev.jump){
    if(state==='PLAYING'){jumpQueued=true;flashJump();}
    else handleStartInput();
  }
  if(btn(9)&&!gpPrev.pause)togglePause();
  if(btn(8)&&!gpPrev.mute)toggleMute();
  /* mirror gamepad movement onto the virtual joystick */
  var md=null;
  if(gl)md={x:-1,y:0};
  else if(gr)md={x:1,y:0};
  else if(up)md={x:0,y:-1};
  else if(down)md={x:0,y:1};
  if(md){vSrc='gp';joyShowDir(md);}
  else if(vSrc==='gp')joyShowDir(null);
  gpPrev={jump:jump,up:up,down:down,pause:btn(9),mute:btn(8)};
}
window.addEventListener('gamepaddisconnected',function(){
  gpPrev={jump:false,up:false,down:false,pause:false,mute:false};
  gpHeld.l=gpHeld.r=gpHeld.u=gpHeld.d=false;
  if(vSrc==='gp')joyShowDir(null);
});

  exitFullscreen();
  location.href='index.html';
}
window.goToMenu=goToMenu;

resetPositions();
paintBG();
updateLives();
window.DK={reset:resetGame,title:toTitle,state:function(){return state;},
  P:function(){return P;},barrels:function(){return barrels;},monkeys:function(){return monkeys;},
  hammer:function(){return {held:hammerHeld,time:hammerTime};},
  clearBlast:function(){barrels.length=0;monkeys.length=0;fires.length=0;dkSpawnT=60;blueNext=true;},
  fire:function(){return fires;},
  set:function(k,v){if(k==='hammerTime')hammerTime=v;if(k==='dkSpawnT')dkSpawnT=v;}};
})();
