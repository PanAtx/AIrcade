<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button:focus:not(:focus-visible), a:focus:not(:focus-visible) { outline: none; }
  html { overscroll-behavior: none; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 30%, #0a0a20 0%, #03030a 70%);
    font-family: 'Courier New', monospace; color: #fff;
    touch-action: manipulation; overscroll-behavior: none;
  }
  html:fullscreen, html:-webkit-full-screen { background: #03030a; overflow: hidden; }
  .wrap { text-align: center; padding: 10px 0; }
  .titlebar {
    display: flex; align-items: center; justify-content: space-between;
    width: min(424px, 96vw); margin: 0 auto;
  }
  #backBtn {
    background: #1c1c4a; color: #ffe01a; border: 2px solid #3a3a9a; border-radius: 8px;
    font-size: 16px; padding: 4px 12px; cursor: pointer; font-family: inherit;
    touch-action: manipulation;
  }
  #backBtn:hover { background: #2a2a6a; box-shadow: 0 0 10px rgba(90,90,220,.5); }
  #backBtn:active { background: #3a3a9a; }
  h1 {
    font-family: 'Press Start 2P', monospace;
    color: #ffe01a; letter-spacing: 4px; margin: 14px 0 10px; font-size: 24px;
    text-shadow: 0 0 14px rgba(255,224,26,.5), 3px 3px 0 #b8860b;
  }
  .hud { display: flex; justify-content: space-between; align-items: center;
         width: min(424px, 96vw); margin: 0 auto 8px; font-size: 14px; letter-spacing: 1px; }
  .hud b { color: #ffe01a; }
  canvas { display: block; margin: 0 auto; background: #000; border: 2px solid #2a2a8a;
           box-shadow: 0 0 35px rgba(40,40,160,.45);
           width: min(420px, 94vw); height: auto; touch-action: none; }
  .stage { position: relative; display: inline-block; width: min(420px, 94vw); margin: 0 auto; }
  #game3d { position: absolute; left: 2px; top: 2px; width: calc(100% - 4px); height: calc(100% - 4px);
            pointer-events: none; z-index: 2; background: transparent; border: none; box-shadow: none; margin: 0; }
  #overlay { position: absolute; left: 2px; top: 2px; width: calc(100% - 4px); height: calc(100% - 4px);
             pointer-events: none; z-index: 3; background: transparent; border: none; box-shadow: none; margin: 0; }
  .lives span {
    display: inline-block; width: 18px; height: 18px; margin-right: 8px;
    background: #ffe01a;
    animation: pacChew 0.6s ease-in-out infinite;
  }
  @keyframes pacChew {
    0%, 100% {
      clip-path: polygon(98.3% 63%, 92.2% 76.8%, 82.3% 88.1%, 69.4% 96.1%, 54.6% 99.8%, 39.7% 98.9%, 25.6% 93.6%, 13.7% 84.4%, 5.6% 73%, 1% 57.4%, 1% 42.6%, 5.6% 27%, 13.7% 15.6%, 25.6% 6.4%, 39.7% 1.1%, 54.6% 0.2%, 69.4% 3.9%, 82.3% 11.9%, 92.2% 23.2%, 98.3% 37%, 50% 50%);
    }
    50% {
      clip-path: polygon(85.4% 85.4%, 75.6% 93%, 64.3% 97.9%, 52.1% 100%, 39.7% 98.9%, 28% 94.9%, 17.7% 88.2%, 9.3% 79%, 3.6% 68.2%, 0.4% 56.1%, 0.4% 43.9%, 3.6% 31.8%, 9.3% 21%, 17.7% 11.8%, 28% 5.1%, 39.7% 1.1%, 52.1% 0%, 64.3% 2.1%, 75.6% 7%, 85.4% 14.6%, 50% 50%);
    }
  }
  .lives span.bonus {
    background: #ffd700;
    box-shadow: 0 0 14px rgba(255,215,0,.95);
    animation: lifePop .7s cubic-bezier(.34,1.56,.64,1), pacChew .6s ease-in-out .7s infinite;
  }
  .cheat {
    font-size: 11px; letter-spacing: 1px; padding: 2px 8px; border-radius: 6px;
    border: 1px solid #3a3a9a; color: #6a6a8a; background: #12122a;
    white-space: nowrap;
  }
  .cheat.on {
    color: #06202a; background: #3ef5f5; border-color: #3ef5f5;
    box-shadow: 0 0 12px rgba(62,245,245,.7); font-weight: bold;
  }
  @keyframes lifePop {
    0%   { transform: scale(0);   filter: brightness(3); }
    60%  { transform: scale(2.1); filter: brightness(2); }
    100% { transform: scale(1);   filter: brightness(1); }
  }
  .btns button {
    background: #1c1c4a; color: #ffe01a; border: 2px solid #3a3a9a; border-radius: 8px;
    font-size: 16px; padding: 4px 12px; margin-left: 8px; cursor: pointer;
    font-family: inherit; touch-action: manipulation;
  }
  .btns button:active { background: #3a3a9a; }
  .btns button.active { background: #4a4acc; color: #fff; }
  .hint { margin-top: 12px; color: #7f7fa8; font-size: 12px; letter-spacing: 1px; }
  .joy { margin: 18px auto 4px; }
  .joy-base {
    position: relative; width: 150px; height: 150px; margin: 0 auto;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, #23236a 0%, #12123a 72%);
    border: 2px solid #3a3a9a;
    box-shadow: inset 0 0 20px rgba(0,0,0,.65), 0 0 14px rgba(60,60,180,.35);
    cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  .joy-base.active { border-color: #5555e0; box-shadow: inset 0 0 20px rgba(0,0,0,.5), 0 0 18px rgba(90,90,220,.55); }
  .joy-stick {
    position: absolute; left: 50%; top: 50%;
    width: 16px; height: 44px; margin-left: -8px; margin-top: -44px;
    border-radius: 8px;
    background: linear-gradient(90deg, #33353d 0%, #8d93a2 25%, #e8ecf4 48%, #f4f6fa 54%, #7d8392 78%, #2c2e35 100%);
    box-shadow: 0 2px 6px rgba(0,0,0,.6);
    transform-origin: 50% 100%;
    transform: rotate(0deg) scaleY(0);
  }
  .joy-knob {
    position: absolute; left: 50%; top: 50%; width: 62px; height: 62px;
    margin-left: -31px; margin-top: -31px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff9d9d 0%, #ff2a2a 45%, #a80f0f 90%);
    border: 2px solid #7a0a0a;
    box-shadow: 0 4px 10px rgba(0,0,0,.55);
    will-change: transform;
  }
  .joy-base.active .joy-knob {
    background: radial-gradient(circle at 35% 30%, #ffc9c9 0%, #ff4444 55%, #9c0c0c 95%);
    border-color: #ff6b6b;
  }
</style>

/* ===== EFFECTS ===== */
var particles=[],shakeTime=0,shakeIntensity=0,floatTexts=[];
function spawnParticles(x,y,color,count,spd){
  spd=spd||1;
  for(var i=0;i<count;i++){
    var a=Math.random()*Math.PI*2,s=(80+Math.random()*200)*spd;
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:0.5+Math.random()*0.5,maxLife:0.5+Math.random()*0.5,
      size:2+Math.random()*4,color:color});
  }
}
function spawnSparkles(x,y){
  for(var i=0;i<3;i++){
    var a=Math.random()*Math.PI*2,s=30+Math.random()*80;
    particles.push({x:x+(Math.random()-0.5)*80,y:y+(Math.random()-0.5)*40,
      vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,
      life:0.8+Math.random()*0.6,maxLife:0.8+Math.random()*0.6,
      size:2+Math.random()*3,color:['#ffd700','#fff','#ff8c00','#fff'][Math.floor(Math.random()*4)]});
  }
}
function triggerShake(intensity,duration){shakeIntensity=intensity;shakeTime=duration;}
function addFloatText(x,y,text,color){floatTexts.push({x:x,y:y,text:text,life:1.2,maxLife:1.2,color:color||'#ffe01a'});}
function updateEffects(dt){
  for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1);}
  if(shakeTime>0)shakeTime-=dt;
  for(var i=floatTexts.length-1;i>=0;i--){floatTexts[i].life-=dt;floatTexts[i].y-=30*dt;if(floatTexts[i].life<=0)floatTexts.splice(i,1);}
}
function clearEffects(){particles=[];floatTexts=[];shakeTime=0;shakeIntensity=0;}
function drawParticles(){
  for(var i=0;i<particles.length;i++){var p=particles[i];ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.color;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);}
  ctx.globalAlpha=1;
}
function drawFloatTexts(){
  ctx.textAlign='center';
  for(var i=0;i<floatTexts.length;i++){var ft=floatTexts[i];ctx.globalAlpha=ft.life/ft.maxLife;
    ctx.font='bold 14px "Press Start 2P",monospace';
    ctx.strokeStyle='#000';ctx.lineWidth=4;ctx.strokeText(ft.text,ft.x,ft.y);
    ctx.fillStyle=ft.color;ctx.fillText(ft.text,ft.x,ft.y);}
  ctx.globalAlpha=1;
}
function drawText8B(text,x,y,size,color){
  var c=T();
  oTextBegin();
  c.textAlign='center';
  c.font='bold '+size+'px "Press Start 2P",monospace';
  c.strokeStyle='#000';c.lineWidth=Math.max(3,size*0.15);
  c.strokeText(text,x,y);
  c.fillStyle=color||'#ffe01a';
  c.fillText(text,x,y);
  oTextEnd();
}
/* Same as drawText8B, but each letter bobs up/down with a per-letter phase -> caterpillar wave */
function drawWavyText8B(text,xc,y,size,color){
  var c=T(),i,ws=[],total=0;
  oTextBegin();
  c.font='bold '+size+'px "Press Start 2P",monospace';
  for(i=0;i<text.length;i++){var w=c.measureText(text[i]).width;ws.push(w);total+=w;}
  var x=xc-total/2;
  c.textAlign='left';
  c.strokeStyle='#000';c.lineWidth=Math.max(3,size*0.15);
  for(i=0;i<text.length;i++){
    var off=Math.sin(time*4-i*0.6)*size*0.45;
    if(text[i]!==' '){
      c.strokeText(text[i],x,y+off);
      c.fillStyle=color||'#ffe01a';
      c.fillText(text[i],x,y+off);
    }
    x+=ws[i];
  }
  c.textAlign='center';
  oTextEnd();
}

/* ===== FRUIT DRAWING ===== */
function drawInvader(x,y,u,topColor,botColor){
  var g=[
    "00100100",
    "01111110",
    "11111111",
    "11011011",
    "11111111",
    "00100100",
    "01011010",
    "10100101"
  ];
  var w=8,h=8,cell=u*2.3;
  var ox=x-w*cell/2, oy=y-h*cell/2-2*u;
  for(var r=0;r<h;r++)for(var c=0;c<w;c++){
    if(g[r]&&g[r][c]==='1'){ctx.fillStyle=(r<4)?topColor:botColor;ctx.fillRect(ox+c*cell,oy+r*cell,cell,cell);}
  }
}
function drawFruitType(name,x,y,s,color){
  var u=s;
  switch(name){
    case 'cherry':{
      ctx.strokeStyle='#4a9a4a';ctx.lineWidth=1.5;
      ctx.beginPath();
      ctx.moveTo(x-5*u,y);ctx.quadraticCurveTo(x-2*u,y-13*u,x+1*u,y-15*u);
      ctx.moveTo(x+5*u,y+1*u);ctx.quadraticCurveTo(x+3*u,y-13*u,x+1*u,y-15*u);
      ctx.stroke();
      ctx.fillStyle=color;
      ctx.beginPath();ctx.arc(x-5*u,y+3*u,6.5*u,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(x+5*u,y+4*u,6.5*u,0,7);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.4)';
      ctx.beginPath();ctx.arc(x-7*u,y+1*u,1.8*u,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(x+3*u,y+2*u,1.4*u,0,7);ctx.fill();
      break;}
    case 'strawberry':{
      ctx.fillStyle='#4a9a4a';
      ctx.beginPath();ctx.ellipse(x,y-6*u,6.5*u,3*u,-0.3,0,7);ctx.fill();
      ctx.fillStyle=color;
      ctx.beginPath();
      ctx.moveTo(x,y+10*u);
      ctx.quadraticCurveTo(x-11*u,y+1*u,x-8*u,y-5*u);
      ctx.quadraticCurveTo(x-3*u,y-9*u,x,y-6*u);
      ctx.quadraticCurveTo(x+3*u,y-9*u,x+8*u,y-5*u);
      ctx.quadraticCurveTo(x+11*u,y+1*u,x,y+10*u);
      ctx.closePath();ctx.fill();
      ctx.fillStyle='#ffee99';
      var seed=[[x-4*u,y-2*u],[x,y-1*u],[x+4*u,y-2*u],[x-2*u,y+3*u],[x+2*u,y+3*u],[x,y+6*u]];
      for(var i=0;i<seed.length;i++){ctx.beginPath();ctx.arc(seed[i][0],seed[i][1],0.9*u,0,7);ctx.fill();}
      break;}
    case 'orange':{
      ctx.fillStyle=color;
      ctx.beginPath();ctx.arc(x,y+1*u,9*u,0,7);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.15)';
      ctx.beginPath();ctx.arc(x-3*u,y-2*u,4*u,0,7);ctx.fill();
      ctx.fillStyle='#4a9a4a';
      ctx.beginPath();ctx.ellipse(x+3*u,y-8*u,4*u,2*u,0.5,0,7);ctx.fill();
      ctx.strokeStyle='#3a7a3a';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(x,y-6*u);ctx.lineTo(x,y-11*u);ctx.stroke();
      break;}
    case 'apple':{
      ctx.fillStyle=color;
      ctx.beginPath();
      ctx.moveTo(x,y-6*u);
      ctx.bezierCurveTo(x-11*u,y-13*u,x-12*u,y+9*u,x,y+8*u);
      ctx.bezierCurveTo(x+12*u,y+9*u,x+11*u,y-13*u,x,y-6*u);
      ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.25)';
      ctx.beginPath();ctx.arc(x-4*u,y,2.5*u,0,7);ctx.fill();
      ctx.strokeStyle='#7a4a2a';ctx.lineWidth=1.6;
      ctx.beginPath();ctx.moveTo(x,y-6*u);ctx.quadraticCurveTo(x+1*u,y-11*u,x+3*u,y-13*u);ctx.stroke();
      ctx.fillStyle='#4a9a4a';
      ctx.beginPath();ctx.ellipse(x+5*u,y-11*u,3.5*u,1.8*u,0.5,0,7);ctx.fill();
      break;}
    case 'melon':{
      ctx.fillStyle=color;
      ctx.beginPath();ctx.ellipse(x,y+1*u,10*u,7*u,0,0,7);ctx.fill();
      ctx.strokeStyle='rgba(0,80,0,0.35)';ctx.lineWidth=1.3;

      ctx.lineTo(x+4*u,y-9*u);ctx.lineTo(x+9*u,y-3*u);ctx.lineTo(x+9*u,y+7*u);

function lerp(a,b,t){return a+(b-a)*t;}

function wrapC(c){return((c%COLS)+COLS)%COLS;}
function pacBlocked(c,r){if(r<0||r>=ROWS)return true;var ch=getMaze()[r][wrapC(c)];return ch==='#'||ch==='D';}

function loc(e){e.px=(e.col+e.dir.x*e.progress)*TILE+TILE/2;e.py=(e.row+e.dir.y*e.progress)*TILE+TILE/2;}

/* --- Fruit roaming (moves around the maze on its own, like a ghost) --- */
function fruitSpeed(){return 2.0*(1+(level-1)*0.15);}
var fruitState=null; // {col,row,progress,dir,face,bobT,px,py}
function fruitDecide(f){
  var moving=f.dir.x||f.dir.y;
  var rev={x:-f.dir.x,y:-f.dir.y};
  var opts=DIRS.filter(function(d){
    if(pacBlocked(f.col+d.x,f.row+d.y))return false;
    if(moving&&d.x===rev.x&&d.y===rev.y)return false;
    return true;
  });
  if(!opts.length)opts=DIRS.filter(function(d){return !pacBlocked(f.col+d.x,f.row+d.y);});
  if(!opts.length){f.dir={x:0,y:0};f.face=0;return;}
  setDir(f,opts[Math.floor(Math.random()*opts.length)]);
}
function stepFruit(f,dt){
  f.bobT=(f.bobT||0)+dt*fruitSpeed();
  if(!f.dir.x&&!f.dir.y){loc(f);return;}
  f.progress+=fruitSpeed()*dt;
  while(f.progress>=1){
    f.progress-=1;
    f.col+=f.dir.x;f.row+=f.dir.y;
    f.col=wrapC(f.col);

/* ===== BFS ===== */
function bfsFirstStep(sc,sr,tc,tr){
  if(sc===tc&&sr===tr)return null;
  var visited={},parent={},queue=[[sc,sr]];
  visited[sc+','+sr]=true;
  while(queue.length){
    var cur=queue.shift(),cc=cur[0],cr=cur[1];
    for(var i=0;i<4;i++){
      var d=DIRS[i],nc=wrapC(cc+d.x),nr=cr+d.y;
      if(nr<0||nr>=ROWS)continue;
      if(getMaze()[nr][nc]==='#')continue;
      var key=nc+','+nr;
      if(visited[key])continue;
      visited[key]=true;parent[key]=[cc,cr];
      if(nc===tc&&nr===tr){
        var node=[nc,nr];
        while(true){var p=parent[node[0]+','+node[1]];if(!p)return null;if(p[0]===sc&&p[1]===sr)return{x:node[0]-sc,y:node[1]-sr};node=p;}
      }
      queue.push([nc,nr]);
    }
  }
  return null;
}

/* ===== PAC MOVEMENT ===== */
function stepPac(dt){
  if(!pac.dir.x&&!pac.dir.y){
    if(pac.want.x||pac.want.y){
      if(!pacBlocked(pac.col+pac.want.x,pac.row+pac.want.y))
        setDir(pac,{x:pac.want.x,y:pac.want.y});
    }
  }
  if(!pac.dir.x&&!pac.dir.y)return;
  pac.progress+=PAC_SPEED*dt;
  while(pac.progress>=1){
    pac.progress-=1;
    pac.col+=pac.dir.x;pac.row+=pac.dir.y;
    pac.col=wrapC(pac.col);
    if(pac.want.x||pac.want.y){
      if(!pacBlocked(pac.col+pac.want.x,pac.row+pac.want.y))
        setDir(pac,{x:pac.want.x,y:pac.want.y});
    }
    if(pacBlocked(pac.col+pac.dir.x,pac.row+pac.dir.y))pac.dir={x:0,y:0};
  }
}
function ghostSpeed(g){
  var m=ghostSpeedMult();
  if(g.mode==='eyes')return 6*m;
  if(g.frightened)return 1.5*m;
  if(g.mode==='house'||g.mode==='exiting'||g.mode==='pause')return 2.0*m;
  return(mode==='scatter'?2.5:3.0)*m;
}
function chaseTarget(g,i){
  if(i===0)return{c:pac.col,r:pac.row};
  if(i===1)return{c:pac.col+pac.dir.x*4,r:pac.row+pac.dir.y*4};
  if(i===2)return{c:pac.col+pac.dir.x*2,r:pac.row+pac.dir.y*2};
  var d=(g.col-pac.col)*(g.col-pac.col)+(g.row-pac.row)*(g.row-pac.row);
  return d>64?{c:pac.col,r:pac.row}:{c:13,r:12};
}
function ghostDecide(g,i){
  var moving=g.dir.x||g.dir.y;
  var rev={x:-g.dir.x,y:-g.dir.y};
  if(g.mode==='eyes'){
    var step=bfsFirstStep(g.col,g.row,HOUSE_CELL.c,HOUSE_CELL.r);
    if(step){setDir(g,step);return;}
    setDir(g,{x:0,y:1});return;
  }
  var opts=DIRS.filter(function(d){
    if(ghostBlocked(g,g.col+d.x,g.row+d.y))return false;
    if(moving&&d.x===rev.x&&d.y===rev.y)return false;
    return true;
  });
  if(!opts.length){setDir(g,{x:rev.x,y:rev.y});return;}
  var t;
  if(g.frightened)t={c:pac.col,r:pac.row};
  else if(mode==='scatter')t=g.scatter;
  else t=chaseTarget(g,i);
  var best=opts[0],bv=-Infinity;
  for(var j=0;j<opts.length;j++){
    var d=opts[j];
    var dc=(g.col+d.x)-t.c;
    if(dc>COLS/2)dc-=COLS;if(dc<-COLS/2)dc+=COLS;
    var dr=(g.row+d.y)-t.r;
    var dist=dc*dc+dr*dr;
    if(Math.random()<0.25)dist*=Math.random();
    var val=g.frightened?-dist:dist;
    if(val>bv){bv=val;best=d;}
  }
  setDir(g,best);
}
function stepGhost(g,i,dt){
  if(g.mode==='house'){
    g.bobT=(g.bobT||0)+dt*2.5;
    g.px=(g.houseCol||7)*TILE+TILE/2 + Math.sin(g.bobT+i)*TILE*0.05;
    g.py=g.row*TILE+TILE/2 + Math.sin(g.bobT*1.4+i)*TILE*0.05;
    g.exitDelay-=dt;
    if(g.exitDelay<=0)startExit(g);
    return;
  }
  if(g.mode==='exiting'){
    g.exitT+=dt/EXIT_DURATION;
    var t=Math.min(1,g.exitT);
    var et=easeInOut(t);
    var cx=lerp(g.exitFromC,7,Math.min(1,t*1.6));
    var cy=lerp(g.exitFromRow,5,et);
    g.px=cx*TILE+TILE/2;
    g.py=cy*TILE+TILE/2 + Math.sin(time*4+i)*2.2;
    g.col=7;g.row=5;
    if(t>=1){g.mode='pause';g.pauseTimer=0.55;setDir(g,{x:0,y:-1});}
    return;
  }
  if(g.mode==='pause'){
    g.px=g.col*TILE+TILE/2;g.py=g.row*TILE+TILE/2;
    g.pauseTimer-=dt;
    if(g.pauseTimer<=0){
      g.mode='normal';
      // Rise straight up out of the house, but never push into a wall: on some
      // levels the wall sits directly above the exit, so if the cell above is
      // blocked we pick a valid, wall-free direction instead of clipping through.
      if(!ghostBlocked(g,g.col,g.row-1)){setDir(g,{x:0,y:-1});}
      else{ghostDecide(g,i);}
    }
    return;
  }
  g.progress+=ghostSpeed(g)*dt;
  while(g.progress>=1){
    g.progress-=1;
    // Safety net: never step through a wall or the door (e.g. right after
    // leaving the house). Re-pick a wall-free direction before moving if needed.
    if(ghostBlocked(g,g.col+g.dir.x,g.row+g.dir.y))ghostDecide(g,i);
    g.col+=g.dir.x;g.row+=g.dir.y;
    g.col=wrapC(g.col);
    ghostDecide(g,i);
  }
  loc(g);
}
function updateDoor(dt){
  var target=0;
  for(var i=0;i<ghosts.length;i++){
    var gm=ghosts[i].mode;
    if(gm==='exiting'){target=1;break;}
    if(gm==='eyes'&&ghosts[i].col===7&&ghosts[i].row===6){target=1;}
  }
  var spd=5*dt;
  if(doorOpen<target)doorOpen=Math.min(target,doorOpen+spd);
  else if(doorOpen>target)doorOpen=Math.max(target,doorOpen-spd);
}
/* ===== EVENTS ===== */
function activateFright(){
  frightTimer=frightDur();combo=0;
  for(var i=0;i<ghosts.length;i++)if(ghosts[i].mode!=='eyes')ghosts[i].frightened=true;
  spawnParticles(pac.px,pac.py,'#ffd700',25);spawnParticles(pac.px,pac.py,'#ff8c00',15);

}
function spawnFruit(){

function eatFruit(){
  var fruit=currentFruit();addScore(fruit.pts,pac.px,pac.py);fruitActive=false;sfx.fruit();
  var fx=fruitState?fruitState.px:0,fy=fruitState?fruitState.py:0;
  spawnParticles(fx,fy,fruit.color,20);spawnParticles(fx,fy,'#ffffff',10);

function eatPellet(){
  var c=wrapC(pac.col);var v=pellets[pac.row][c];if(!v)return;
  pellets[pac.row][c]=0;remaining--;pelletsEaten++;
  if(v===2){addScore(50,pac.px,pac.py);activateFright();sfx.power();}
  else{addScore(10,pac.px,pac.py);sfx.pellet();}
  if(!fruitSpawned&&pelletsEaten>=FRUIT_AFTER)spawnFruit();
  if(remaining<=0){startIntermission();}
}
function fruitCollision(){
  if(!fruitActive||!fruitState)return;
  var dx=fruitState.px-pac.px,dy=fruitState.py-pac.py;
  if(dx*dx+dy*dy<(TILE*0.6)*(TILE*0.6))eatFruit();
}
function collisions(){
  var rr=TILE*0.7;
  for(var i=0;i<ghosts.length;i++){
    var g=ghosts[i];
    if(g.mode==='eyes'||g.mode==='house'||g.mode==='exiting'||g.mode==='pause')continue;
    var dx=g.px-pac.px,dy=g.py-pac.py;
    if(dx*dx+dy*dy<rr*rr){
      if(g.frightened){
        g.frightened=false;g.mode='eyes';
        var pts=[200,400,800,1600][Math.min(combo,3)];addScore(pts,g.px,g.py);combo++;sfx.ghost();
        spawnParticles(g.px,g.py,'#4444ff',20);spawnParticles(g.px,g.py,'#ffffff',10);spawnParticles(g.px,g.py,g.color,12);
        addFloatText(g.px,g.py-20,'+'+pts);triggerShake(8,0.3);freezeTimer=0.12;
      }else if(!cheatMode){
        lives--;updateLives();sfx.die();triggerShake(5,0.5);
        if(lives<=0){state='GAMEOVER';saveHigh();gameOverTimer=GO_TITLE_DELAY;}
        else{state='DYING';stateTimer=1.2;}
        return;
      }
    }
  }
}
/* ===== UPDATE ===== */
function update(dt){
  updateEffects(dt);
  if(extraLifeFx>0)extraLifeFx-=dt;
  if(paused)return;
  time+=dt;
  if(transPhase==='out'){
    transAlpha+=dt*2.0;
    if(transAlpha>=1){transAlpha=1;transPhase='in';completeLevelTransition();}
    return;
  }
  if(transPhase==='in'){
    transAlpha-=dt*2.0;
    if(transAlpha<=0){transAlpha=0;transPhase='none';}
    return;
  }
  if(freezeTimer>0){freezeTimer-=dt;return;}
  if(state==='TITLE')return;
  if(state==='INTERMISSION'){
    stateTimer-=dt;
    if(stateTimer<=0){
      transPendingLevel=level+1;
      transPhase='out';transAlpha=0;
    }
    return;
  }
  if(state==='CUTSCENE'){
    csT+=dt;
    if(csT>=CS_P1+CS_P2){
      transPendingLevel=level+1;
      transPhase='out';transAlpha=0;
    }
    return;
  }
  if(state==='READY'){stateTimer-=dt;if(stateTimer<=0)state='PLAYING';return;}
  if(state==='DYING'){stateTimer-=dt;if(stateTimer<=0){resetPositions();state='READY';stateTimer=1.2;sfx.ready();}return;}
  if(state==='GAMEOVER'){
    if(newHigh){
      highSparkleTimer-=dt;
      if(highSparkleTimer<=0){highSparkleTimer=0.15;spawnSparkles(canvas.width/2,canvas.height/2-40);}
    }
    if(gameOverTimer>0){
      gameOverTimer-=dt;
      if(gameOverTimer<=0){goTitle();}
    }
    return;
  }
  if(state!=='PLAYING')return;
  if(frightTimer>0){frightTimer-=dt;if(frightTimer<=0){frightTimer=0;combo=0;for(var i=0;i<ghosts.length;i++)ghosts[i].frightened=false;}}
  else{modeTimer-=dt;if(modeTimer<=0){mode=mode==='scatter'?'chase':'scatter';modeTimer=mode==='scatter'?5:20;}}
  if(fruitActive){fruitTimer-=dt;if(fruitTimer<=0){fruitActive=false;}else if(fruitState)stepFruit(fruitState,dt);}
  stepPac(dt);loc(pac);
  if(pac.dir.x||pac.dir.y){
    wakaTimer+=dt;
    var wi=0.11;
    while(wakaTimer>=wi){wakaTimer-=wi;wakaTick();}
  }else{
    wakaTimer=0;
  }
  eatPellet();fruitCollision();
  if(state!=='PLAYING')return;
  for(var i=0;i<ghosts.length;i++){
    var g=ghosts[i];
    var gBefore=g.mode;
    stepGhost(g,i,dt);
    if((gBefore==='exiting'||gBefore==='pause')&&g.mode==='normal'&&!readyJingled){
      readyJingled=true;sfx.ghostReady();
    }
    if(g.mode==='eyes'&&g.col===HOUSE_CELL.c&&g.row===HOUSE_CELL.r){
      g.frightened=false;
      startExit(g);
    }
  }
  updateDoor(dt);
  collisions();
}

var MAZE_THEMES=[
  {stroke:'#6b8aff', glow:'rgba(100,140,255,1)', hi:'rgba(190,210,255,0.9)', tunnel:'60,60,180'},
  {stroke:'#4ade80', glow:'rgba(90,255,150,1)',  hi:'rgba(200,255,215,0.9)', tunnel:'40,140,60'},
  {stroke:'#ff6bd6', glow:'rgba(255,107,214,1)', hi:'rgba(255,190,235,0.9)', tunnel:'180,40,120'},

  {stroke:'#b06bff', glow:'rgba(176,107,255,1)', hi:'rgba(216,182,255,0.9)', tunnel:'120,50,180'},
  {stroke:'#3ef5f5', glow:'rgba(62,245,245,1)',  hi:'rgba(185,255,255,0.9)', tunnel:'30,150,160'},
  {stroke:'#ff5d7a', glow:'rgba(255,93,122,1)',  hi:'rgba(255,185,200,0.9)', tunnel:'180,40,60'}

function mazeTheme(){return MAZE_THEMES[(level-1)%MAZE_THEMES.length];}
function drawWalls(){
  var M=getMaze();

    if(M[r][c]!=='#')continue;
    var x=c*TILE,y=r*TILE;

    ctx.fillStyle='#000';ctx.fillRect(x+2,y+2,TILE-4,TILE-4);

  ctx.beginPath();
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
    if(M[r][c]!=='#')continue;
    var x=c*TILE,y=r*TILE;
    var left=wrapC(c-1),right=wrapC(c+1);
    if(M[r][left]!=='#'){ctx.moveTo(x,y);ctx.lineTo(x,y+TILE);}
    if(M[r][right]!=='#'){ctx.moveTo(x+TILE,y);ctx.lineTo(x+TILE,y+TILE);}
    if(r>0&&M[r-1][c]!=='#'){ctx.moveTo(x,y);ctx.lineTo(x+TILE,y);}
    if(r<ROWS-1&&M[r+1][c]!=='#'){ctx.moveTo(x,y+TILE);ctx.lineTo(x+TILE,y+TILE);}
  }
  ctx.stroke();
  ctx.shadowBlur=0;
  ctx.strokeStyle=th.hi;
  ctx.lineWidth=1.2;
  ctx.lineCap='round';
  ctx.lineJoin='bevel';
  ctx.beginPath();
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
    if(M[r][c]!=='#')continue;
    var x=c*TILE,y=r*TILE;
    var left=wrapC(c-1),right=wrapC(c+1);
    if(M[r][left]!=='#'){ctx.moveTo(x,y);ctx.lineTo(x,y+TILE);}
    if(M[r][right]!=='#'){ctx.moveTo(x+TILE,y);ctx.lineTo(x+TILE,y+TILE);}
    if(r>0&&M[r-1][c]!=='#'){ctx.moveTo(x,y);ctx.lineTo(x+TILE,y);}
    if(r<ROWS-1&&M[r+1][c]!=='#'){ctx.moveTo(x,y+TILE);ctx.lineTo(x+TILE,y+TILE);}
  }
  ctx.stroke();
  ctx.restore();
}
function drawTunnel(){

function drawDoor(){

  var open=doorOpen;

function drawPellets(){

function drawFruit(){

function drawPac(){
  var x=pac.px,y=pac.py,r=TILE*0.45;
  if(state==='DYING'){
    var t=1.0-(stateTimer/1.2);
    if(t<0)t=0;if(t>1)t=1;

    r=r*(1-t*0.7);

function drawEyes(x,y,r,ox,oy){
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(x-r*0.35,y,r*0.3,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(x+r*0.35,y,r*0.3,0,7);ctx.fill();
  ctx.fillStyle='#123';
  ctx.beginPath();ctx.arc(x-r*0.35+ox,y+oy,r*0.15,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(x+r*0.35+ox,y+oy,r*0.15,0,7);ctx.fill();
}
function drawSkullFace(x, y, r, scale, jit){
  ctx.save();
  ctx.translate(x+jit, y);
  ctx.scale(scale, scale);
  var dark='#12122a', bone='#e9eef2';
  ctx.fillStyle=dark;
  ctx.beginPath();ctx.arc(-r*0.32,-r*0.02,r*0.22,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(r*0.32,-r*0.02,r*0.22,0,7);ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0,r*0.14);ctx.lineTo(-r*0.1,r*0.32);ctx.lineTo(r*0.1,r*0.32);
  ctx.closePath();ctx.fill();
  var mw=r*0.72, mh=r*0.3, my0=r*0.4;
  ctx.fillStyle=dark;
  ctx.fillRect(-mw/2,my0,mw,mh);
  ctx.strokeStyle=bone;ctx.lineWidth=Math.max(1,r*0.07);
  for(var i=1;i<6;i++){var tx=-mw/2+mw*(i/6);ctx.beginPath();ctx.moveTo(tx,my0);ctx.lineTo(tx,my0+mh);ctx.stroke();}
  ctx.restore();
}
function drawGhost(g){
  var x=g.px,y=g.py,r=TILE*0.44;
  var angle=Math.atan2(pac.py-y,pac.px-x);
  var ox=Math.cos(angle)*r*0.12,oy=Math.sin(angle)*r*0.12;
  if(g.mode==='eyes'){drawEyes(x,y-r*0.1,r,ox,oy);return;}
  var body;
  if(g.frightened)body=(frightTimer<2&&Math.floor(time*5)%2===0)?'#f0f0f0':'#2b3bff';
  else body=g.color;
  var yb=y+r*0.85,ym=y+r*0.55,w=2*r/3;
  var waveSpeed=9, waveAmp=r*0.09, phase0=time*waveSpeed+(g.skirtPhase||0);
  function skirtY(px){
    var ph=((px-(x-r))/(2*r))*2.4;
    return Math.sin(phase0-ph)*waveAmp;
  }
  ctx.fillStyle=body;ctx.beginPath();
  ctx.arc(x,y-r*0.1,r,Math.PI,0);
  ctx.lineTo(x+r,yb+skirtY(x+r));
  for(var i=0;i<3;i++){
    var vx=x+r-w*(i+0.5),vxoff=skirtY(vx);
    ctx.lineTo(vx,ym+vxoff);
    var px=x+r-w*(i+1);
    ctx.lineTo(px,yb+skirtY(px));
  }
  ctx.closePath();ctx.fill();
  if(g.frightened){
    if(frightTimer<1){
      var pop=Math.min(1,(1-frightTimer)/0.12);
      drawSkullFace(x,y-r*0.12,r,0.55+0.45*pop,Math.sin(time*42)*1.3*pop);
    }else{
      ctx.fillStyle='#f0f0f0';
      ctx.beginPath();ctx.arc(x-r*0.3,y-r*0.2,r*0.16,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(x+r*0.3,y-r*0.2,r*0.16,0,7);ctx.fill();
      ctx.strokeStyle='#f0f0f0';ctx.lineWidth=2;ctx.beginPath();
      var mx=x-r*0.5;ctx.moveTo(mx,y+r*0.5);
      for(var i=0;i<4;i++){ctx.lineTo(mx+r*0.125,y+r*0.3);ctx.lineTo(mx+r*0.25,y+r*0.5);mx+=r*0.25;}
      ctx.stroke();
    }
  }else{
    drawEyes(x,y-r*0.15,r,ox,oy);
  }
}

/* ===== CUTSCENE (after every 3rd level) ===== */
function csGhost(x,y,r,color,fright,dirx){
  var yb=y+r*0.85,ym=y+r*0.55,w=2*r/3;
  ctx.save();
  ctx.shadowColor=color;ctx.shadowBlur=9;
  ctx.fillStyle=fright?'#3b4bff':color;
  ctx.beginPath();
  ctx.arc(x,y-r*0.1,r,Math.PI,0);
  ctx.lineTo(x+r,yb);
  for(var i=0;i<3;i++){
    var vx=x+r-w*(i+0.5);
    ctx.lineTo(vx,ym+Math.sin(time*11+i*1.4)*r*0.08);
    var px=x+r-w*(i+1);
    ctx.lineTo(px,yb);
  }
  ctx.closePath();ctx.fill();
  ctx.restore();
  if(fright){
    ctx.fillStyle='#f0f0f0';
    ctx.beginPath();ctx.arc(x-r*0.32,y-r*0.12,r*0.19,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(x+r*0.32,y-r*0.12,r*0.19,0,7);ctx.fill();
    ctx.strokeStyle='#f0f0f0';ctx.lineWidth=2;ctx.beginPath();
    var mx=x-r*0.5;ctx.moveTo(mx,y+r*0.5);
    for(var i=0;i<4;i++){ctx.lineTo(mx+r*0.125,y+r*0.3);ctx.lineTo(mx+r*0.25,y+r*0.5);mx+=r*0.25;}
    ctx.stroke();
  }else{
    var ox=dirx*r*0.14;
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(x-r*0.34,y-r*0.18,r*0.28,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(x+r*0.34,y-r*0.18,r*0.28,0,7);ctx.fill();
    ctx.fillStyle='#2b50c8';
    ctx.beginPath();ctx.arc(x-r*0.34+ox,y-r*0.18,r*0.15,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(x+r*0.34+ox,y-r*0.18,r*0.15,0,7);ctx.fill();
  }
}
function csPac(x,y,r,face){
  var m=0.25+0.5*Math.abs(Math.sin(time*13));
  ctx.save();
  ctx.shadowColor='#ffe01a';ctx.shadowBlur=12;
  ctx.fillStyle='#ffe01a';
  ctx.beginPath();ctx.moveTo(x,y);
  ctx.arc(x,y,r,face+m,face-m,false);
  ctx.closePath();ctx.fill();
  ctx.restore();
}
function drawCutscene(){
  var W=canvas.width,H=canvas.height;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  /* twinkling stars (pseudo-random scatter, no grid pattern) */
  for(var i=0;i<26;i++){
    var h1=Math.sin(i*12.9898+78.233)*43758.5453;
    var h2=Math.sin(i*39.346+11.135)*43758.5453;
    var sx=(h1-Math.floor(h1))*W;
    var sy=(h2-Math.floor(h2))*(H*0.42);
    var sz=1+(Math.sin(i*5.71)*0.5+0.5)*1.6;
    ctx.globalAlpha=0.2+0.5*Math.abs(Math.sin(time*(1.2+(i%5)*0.35)+i*1.7));
    ctx.fillStyle='#cfd6ff';
    ctx.fillRect(sx,sy,sz,sz);
  }
  ctx.globalAlpha=1;
  /* road the chase happens on */
  var yMid=H*0.5;
  ctx.fillStyle='#12122c';
  ctx.fillRect(0,yMid+16,W,30);
  ctx.strokeStyle='#33337a';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,yMid+17);ctx.lineTo(W,yMid+17);ctx.stroke();
  drawText8B('LEVEL '+level+' CLEAR!',W/2,52,15,'#ffe01a');
  drawText8B('NEXT: LEVEL '+(level+1),W/2,H-34,10,'#3ef5f5');
  var bob=Math.sin(time*10)*2.5;
  if(csT<CS_P1){
    /* phase 1: pacman chases a blue edible ghost, left -> right */
    var t1=easeInOut(Math.min(1,csT/CS_P1));
    var gx=lerp(-40,W+60,t1);
    var px=lerp(-95,W+5,t1);
    /* pellet trail, eaten as pac passes */
    ctx.fillStyle='#ffd9a8';
    for(var dx=12;dx<W-8;dx+=26){
      if(dx<px+10)continue;
      ctx.beginPath();ctx.arc(dx,yMid,3,0,7);ctx.fill();
    }
    csGhost(gx,yMid+bob,16,'#3b4bff',true,1);
    csPac(px,yMid+bob,17,0);
  }else{
    /* phase 2: all ghosts chase pacman, right -> left */
    var t2=easeInOut(Math.min(1,(csT-CS_P1)/CS_P2));
    var p2x=lerp(W+60,-150,t2);
    ctx.fillStyle='#ffd9a8';
    for(var dx2=12;dx2<W-8;dx2+=26){
      if(dx2>p2x-10)continue;
      ctx.beginPath();ctx.arc(dx2,yMid,3,0,7);ctx.fill();
    }
    var cols=['#ff3b3b','#ffb8de','#3ef5f5','#ffb847'];
    var offs=[38,62,88,110];
    for(var gi=0;gi<4;gi++){
      csGhost(p2x+offs[gi]+Math.sin(time*8+gi*1.3)*4,yMid+bob+Math.sin(time*7+gi)*3,14,cols[gi],false,-1);
    }
    csPac(p2x,yMid+bob,17,Math.PI);
  }
}

var joyBase=document.getElementById('joyBase'),joyKnob=document.getElementById('joyKnob'),joyStick=document.getElementById('joyStick');
var joyActive=false,joyPointerId=null,joyLastDir=null;
function joyApply(px,py){
  var r=joyBase.getBoundingClientRect(),kr=joyKnob.getBoundingClientRect();
  var cx=r.left+r.width/2,cy=r.top+r.height/2;
  var max=r.width/2-(kr.width/2);
  var dx=px-cx,dy=py-cy,dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>max){var s=max/dist;dx*=s;dy*=s;dist=max;}
  joyKnob.style.transform='translate('+dx+'px,'+dy+'px)';
  /* metal pole: points from base center toward the knob, stretches with distance */
  var ang=dist>0?Math.atan2(dy,dx)*180/Math.PI+90:0;
  joyStick.style.transform='rotate('+ang+'deg) scaleY('+(dist/max)+')';
  /* only the dominant axis is acknowledged -> never a diagonal */
  var dz=max*0.25,dir=null;
  if(dist>=dz){
    if(Math.abs(dx)>=Math.abs(dy))dir=dx>=0?{x:1,y:0}:{x:-1,y:0};
    else dir=dy>=0?{x:0,y:1}:{x:0,y:-1};
  }
  if(dir&&(!joyLastDir||joyLastDir.x!==dir.x||joyLastDir.y!==dir.y)){joyLastDir=dir;setWant(dir);}
  else if(!dir){joyLastDir=null;}
}
function joyReset(){
  joyActive=false;joyPointerId=null;joyLastDir=null;

function kbDirKey(k){

/* ===== GAMEPAD ===== */
var gpPrevButtons=[],STICK_DEADZONE=0.5;
/* This machine can enumerate SEVERAL gamepads at once (e.g. a Razer
   "Unknown Gamepad" AND a "STANDARD GAMEPAD"). Reading only the first slot
   left the pad the player actually holds completely dead, so MERGE every
   connected pad into one virtual pad: union of pressed buttons,
   max-magnitude axes. */
function mergedGamepad(){
  var pads=null;
  try{pads=navigator.getGamepads?navigator.getGamepads():null;}catch(err){return null;}
  if(!pads)return null;
  var any=false,nBtn=0,pressed={},axes=[];
  for(var i=0;i<pads.length;i++){
    var p=pads[i];
    if(!p||!p.connected)continue;
    var pb=p.buttons||[],pa=p.axes||[];
    if(pb.length||pa.length)any=true;
    if(pb.length>nBtn)nBtn=pb.length;
    for(var bi=0;bi<pb.length;bi++){if(pb[bi]&&(pb[bi].pressed||(pb[bi].value||0)>0.5))pressed[bi]=true;}
    for(var ai=0;ai<pa.length;ai++){var v=pa[ai]||0;if(Math.abs(v)>Math.abs(axes[ai]||0))axes[ai]=v;}
  }
  if(!any)return null;
  var buttons=[];
  for(var k=0;k<nBtn;k++)buttons.push({pressed:!!pressed[k],value:pressed[k]?1:0});
  return{connected:true,axes:axes,buttons:buttons};
}
function pollGamepad(){
  var gp=mergedGamepad();
  if(!gp)return;ac();
  var btns=gp.buttons;
  var btnDown=function(idx){return btns[idx]&&btns[idx].pressed;};
  function pressedNow(idx){var cur=btns[idx]&&btns[idx].pressed;var prev=gpPrevButtons[idx];gpPrevButtons[idx]=cur;return cur&&!prev;}
  if(state==='TITLE'){
    for(var i=0;i<btns.length;i++){if(btns[i]&&btns[i].pressed){startFromTitle();return;}}

    // resets) — tap the on-screen ↺ button to restart. After the game-over
    // delay the title screen returns, and any button starts a new game there.
    return;
  }
  if(pressedNow(9)){togglePause();} // START button = pause (restart is screen-button only)
  if(pressedNow(8)){toggleMute();} // SELECT button = mute
  if(paused)return;
  var d=null;

  else if(btnDown(14))d={x:-1,y:0};

    else if(sy>STICK_DEADZONE)d={x:0,y:1};
  }
  if(d){setWant(d);vSrc='gp';joyShowDir(d);}
  else if(vSrc==='gp')joyShowDir(null);
}

<script>
/* Prevent accidental mobile pull-to-refresh: a downward swipe at the top of the
   page (e.g. an accidental swipe-down during gameplay) used to reload the page
   and wipe out the game. CSS `overscroll-behavior: none` handles modern
   browsers; this blocks the down-swipe-at-the-top gesture as a fallback for
   browsers/versions that ignore it (e.g. older iOS Safari). It only blocks the
   pull-down gesture, so normal scrolling, taps and the joystick still work. */
(function () {
  var startY = 0, THRESHOLD = 8;
  function atTop() {
    return (window.pageYOffset ||
            document.documentElement.scrollTop ||
            document.body.scrollTop || 0) <= 0;
  }
  document.addEventListener('touchstart', function (e) {
    startY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (atTop() && e.touches[0].clientY - startY > THRESHOLD) e.preventDefault();
  }, { passive: false });
})();
</script>
