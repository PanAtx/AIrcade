<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button:focus:not(:focus-visible) { outline: none; }
  html { overscroll-behavior: none; }
  body {
    margin: 0; min-height: 100vh; display: flex; justify-content: center;
    background: radial-gradient(circle at 50% 30%, #0a0a20 0%, #03030a 70%);
    font-family: 'Courier New', monospace; color: #fff;
    touch-action: manipulation; overscroll-behavior: none;
  }
  html:fullscreen, html:-webkit-full-screen { background: #03030a; overflow: hidden; }
  html:fullscreen body, html:-webkit-full-screen body {
    height: 100vh; align-items: center; justify-content: center;
  }
  .wrap { text-align: center; padding: 8px 0 18px; width: 100%; }
  .titlebar {
    display: flex; align-items: center; justify-content: space-between;
    width: min(424px, 96vw); margin: 0 auto;
  }
  #backBtn {
    background: #1c1c4a; color: #ffd23e; border: 2px solid #3a3a9a; border-radius: 8px;
    font-size: 15px; padding: 4px 12px; cursor: pointer; font-family: inherit;
    touch-action: manipulation;
  }
  #backBtn:hover { background: #2a2a6a; box-shadow: 0 0 10px rgba(90,90,220,.5); }
  .spacer { width: 66px; }
  h1 {
    font-family: 'Press Start 2P', monospace;
    color: #ff5a3c; letter-spacing: 3px; margin: 10px 0 8px; font-size: 20px;
    text-shadow: 0 0 14px rgba(255,90,60,.5), 3px 3px 0 #7a2010;
  }
  .hud {
    display: flex; justify-content: space-between; align-items: center;
    width: min(424px, 96vw); margin: 0 auto 8px;
    font-family: 'Press Start 2P', monospace; font-size: 11px; letter-spacing: 1px;
  }
  .hud b { color: #ffd23e; }
  .cheat {
    font-size: 11px; letter-spacing: 1px; padding: 2px 8px; border-radius: 6px;
    border: 1px solid #3a3a9a; color: #6a6a8a; background: #12122a;
    white-space: nowrap;
  }
  .cheat.on {
    color: #06202a; background: #3ef5f5; border-color: #3ef5f5;
    box-shadow: 0 0 12px rgba(62,245,245,.7); font-weight: bold;
  }
  .stage {
    position: relative; display: inline-block; margin: 0 auto;
    /* 4:3 kept via aspect-ratio; width capped by vh so the whole column
       (title + HUD + stage + joystick) always fits in the viewport */
    width: min(420px, 94vw, max(220px, calc((100vh - 340px) * 0.75)));
    aspect-ratio: 3 / 4;
    background: #04040c; border: 2px solid #2a2a8a;
    box-shadow: 0 0 35px rgba(40,40,160,.45);
  }
  .stage canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #bg { z-index: 1; }
  #game3d { z-index: 2; pointer-events: none; }
  #overlay { z-index: 3; touch-action: none; }
  .hud-bottom { margin-top: 10px; }
  .lives span {
    display: inline-block; width: 13px; height: 16px; margin-right: 6px;
    background: linear-gradient(#e03020 0 55%, #2a3fd4 55% 100%);
    border: 1px solid #556; border-radius: 3px;
  }
  #hearts { color: #ff4d5e; letter-spacing: 1px; }
  #hearts .off { color: #33334d; }
  .btns button {
    background: #1c1c4a; color: #ffd23e; border: 2px solid #3a3a9a; border-radius: 8px;
    font-size: 16px; padding: 4px 12px; margin-left: 8px; cursor: pointer;
    font-family: inherit; touch-action: manipulation;
  }
  .btns button:active { background: #3a3a9a; }
  .btns button.active { background: #4a4acc; color: #fff; }
  /* spread the pads to the edges: joystick to the LEFT, jump to the RIGHT —
     matches natural thumb positions on phones */
  .pads {
    display: flex; align-items: center; justify-content: center;
    width: min(424px, 94vw); margin: 16px auto 0;
    column-gap: clamp(40px, 18vw, 96px);
  }
  .joy-base {
    position: relative; width: 132px; height: 132px; margin: 0; border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, #23236a 0%, #12123a 72%);
    border: 2px solid #3a3a9a;
    box-shadow: inset 0 0 20px rgba(0,0,0,.65), 0 0 14px rgba(60,60,180,.35);
    cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  .joy-base.active { border-color: #5555e0; box-shadow: inset 0 0 20px rgba(0,0,0,.5), 0 0 18px rgba(90,90,220,.55); }
  .joy-stick {
    position: absolute; left: 50%; top: 50%; width: 14px; height: 38px;
    margin-left: -7px; margin-top: -38px; border-radius: 7px;
    background: linear-gradient(90deg, #33353d 0%, #8d93a2 25%, #e8ecf4 48%, #f4f6fa 54%, #7d8392 78%, #2c2e35 100%);
    box-shadow: 0 2px 6px rgba(0,0,0,.6);
    transform-origin: 50% 100%;
    transform: rotate(0deg) scaleY(0);
  }
  .joy-knob {
    position: absolute; left: 50%; top: 50%; width: 54px; height: 54px;
    margin-left: -27px; margin-top: -27px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff9d9d 0%, #ff2a2a 45%, #a80f0f 90%);
    border: 2px solid #7a0a0a; box-shadow: 0 4px 10px rgba(0,0,0,.55);
    will-change: transform;
  }
  .joy-base.active .joy-knob {
    background: radial-gradient(circle at 35% 30%, #ffc9c9 0%, #ff4444 55%, #9c0c0c 95%);
    border-color: #ff6b6b;
  }
  /* YELLOW JUMP BUTTON — built purely from CSS shapes (circle + triangle) */
  .jump-btn {
    position: relative; width: 104px; height: 104px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff3a0 0%, #ffd400 45%, #c78f00 100%);
    border: 3px solid #8a6a00;
    box-shadow: inset 0 -8px 14px rgba(120,80,0,.55), 0 6px 14px rgba(0,0,0,.5), 0 0 18px rgba(255,210,0,.4);
    cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  .jump-btn:active, .jump-btn.active { filter: brightness(1.18); transform: scale(.95); }
  .j-arrow {
    position: absolute; left: 50%; top: 40%; width: 0; height: 0; margin-left: -19px;
    border-left: 19px solid transparent; border-right: 19px solid transparent;
    border-bottom: 26px solid #7a5a00;
  }
  .j-label {
    position: absolute; left: 0; right: 0; bottom: 15px;
    font-family: 'Press Start 2P', monospace; font-size: 10px; color: #7a5a00; letter-spacing: 2px;
  }
  .hint { margin-top: 14px; color: #7f7fa8; font-size: 11px; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="titlebar">
    <button id="backBtn" type="button" title="Back to menu" onclick="if(typeof goToMenu==='function'){goToMenu();}else{location.href='index.html';}">← Back</button>
    <h1>DONKEY KONG</h1>
    <span class="spacer"></span>
  </div>
  <div class="hud">
    <span>SCORE&nbsp;<b id="score">0</b></span>
    <span>LVL&nbsp;<b id="level">1</b></span>
    <span>HP&nbsp;<b id="hearts"></b></span>
    <span>HIGH&nbsp;<b id="high">0</b></span>
  </div>
  <div class="stage" id="stage">
    <canvas id="bg" width="420" height="560"></canvas>
    <canvas id="game3d"></canvas>
    <canvas id="overlay" width="420" height="560"></canvas>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <div class="hud hud-bottom">
    <span class="lives" id="lives"></span>
    <span class="cheat" id="cheat" style="display:none">CHEAT MODE</span>
    <span class="btns">
      <button id="pauseBtn" type="button" title="Pause (P)">⏸</button>
      <button id="muteBtn" type="button" title="Mute (M)">🔊</button>
      <button id="restartBtn" type="button" title="Restart (R)">↺</button>
    </span>
  </div>
  <div class="pads">
    <div class="joy-base" id="joyBase">
      <div class="joy-stick" id="joyStick"></div>
      <div class="joy-knob" id="joyKnob"></div>
    </div>
    <div class="jump-btn" id="jumpBtn" title="Jump (SPACE)">
      <div class="j-arrow"></div>
      <div class="j-label">JUMP</div>
    </div>
  </div>
  <div class="hint">ARROWS / WASD · SPACE = JUMP · JOYSTICK + YELLOW JUMP · GAMEPAD<br>P = PAUSE · R = RESTART · M = MUTE · C = CHEAT · L = CLEAR LEVEL (WITH CHEAT ON)</div>
</div>
<script>
(function(){
"use strict";
/* ===== WORLD (screen coords: x right, y down, origin top-left) ===== */
var W=420,H=560;
/* 8 GIRDERS, like the 1981 arcade original. y = surface y at the HIGH end.
   dir = barrel roll direction: -1 rolls LEFT (left end low - pitches UP from
   left to right), +1 rolls RIGHT (right end low - pitches DOWN from left to
   right), 0 = flat. Pitches ALTERNATE, so barrels reverse direction every
   time they fall off an edge; each girder sits INSIDE the span of the one
   below it so every edge-fall lands on the level directly underneath.
   Barrel route: DK drum -> right -> (off edge) -> left -> right -> left ->
   right -> bottom -> oil drum. */
var GIRDS=[
  {x1:0,   x2:420,y:515,dir:-1},  /* 0 bottom: pitches up L->R, barrel rolls left to the oil drum */
  {x1:10,  x2:410,y:455,dir:1},   /* 1: pitches down L->R, barrel rolls right */
  {x1:20,  x2:400,y:395,dir:-1},  /* 2: pitches up L->R, barrel rolls left */
  {x1:30,  x2:390,y:335,dir:1},   /* 3: pitches down L->R, barrel rolls right */
  {x1:40,  x2:380,y:275,dir:-1},  /* 4: pitches up L->R, barrel rolls left */
  {x1:50,  x2:370,y:215,dir:1},   /* 5: DONKEY KONG's platform (pitches down L->R), drum at the left */
  {x1:150, x2:358,y:150,dir:0},   /* 6: PAULINE (7th from bottom) - level girder, no pitch */
  {x1:160, x2:348,y:92, dir:0}    /* 7: small top platform */
];
/* Ladders: one climbable ladder per gap (alternating sides, like the original)
   plus BROKEN ladders (barrel:true) - barrels roll DOWN them, but Mario cannot
   climb them at all (not up, not down) - ladderAt() skips broken ladders so
   Mario can never start on one. Broken ladders are drawn with their middle
   rungs cut out plus a piece of both side rails removed, so the player can
   see (and knows not to climb) which ladders are broken.
   Exception: the top gap (g6-g7) has two working ladders side by side (215 &
   245). Everywhere else ladders are spaced at least 90px apart, so a broken one is never next to a working one. */
var LADDS=[
  {x:360, up:1,down:0},
  {x:270, up:1,down:0,broken:true,barrel:true},  /* broken - g1 barrel route */
  {x:170, up:2,down:1},
  {x:70,  up:2,down:1,broken:true,barrel:true},  /* broken - g2 barrel route */
  {x:360, up:3,down:2},
  {x:270, up:3,down:2,broken:true,barrel:true},  /* broken - g3 barrel route */
  {x:170, up:4,down:3},
  {x:70,  up:4,down:3,broken:true,barrel:true},  /* broken - g4 barrel route */
  {x:360, up:5,down:4},
  {x:270, up:5,down:4,broken:true,barrel:true},  /* broken - g5 barrel route */
  {x:170, up:6,down:5},                                /* up to Pauline */
  {x:215, up:7,down:6},                 /* top gap: one just right of Pauline (190) */
  {x:245, up:7,down:6}                  /* plus one right next to it (two physical ladders) */
];
var DRUM={x:28,y:537};
var PAULINE={x:190,y:150},KISS_X=205;    /* Pauline stands top-LEFT of girder 6; kiss spot just to her right */
var DKPOS={x:130,y:219};                 /* DK on girder 5 (6th from bottom) */
var BARREL_STACKS=[{x:64,n:3},{x:92,n:4}]; /* barrel pyramids on DK's LEFT (like the 1981 original): n = total barrels, bottom row of 2 + 1 per row above; DK grabs from the top of the tallest stack */
var DK_ANIM={turnL:0.30,grab:0.35,turnR:0.30,roll:0.40}; /* DK barrel-throw animation phase durations (s) */
var PITCH=0.05;                          /* per-girder slope (1981-style gentle pitch) */
var BR=8.5;                              /* barrel radius in px (physics + visuals) */
function gy(g,x){                        /* girder surface y at world x */
  if(!g.dir)return g.y;
  return g.y+PITCH*(g.dir<0?(g.x2-x):(x-g.x1));
}
/* TWO static hammers (arcade style - each can be picked up once, then it's gone).
   NOTE: the 3D rig is built UPWARD from its anchor (handle 0..17, head at +21),
   so a hammer occupies HM.y-25..HM.y on screen. Both hang fully in the middle of
   their gap, clear of both girders. */
var HAMS=[
  {x:85, y:gy(GIRDS[3],85)+50,    taken:false}, /* between girders 3 & 4 - original spot, grabbed from the girder below */
  {x:70, y:gy(GIRDS[4],70)-17.75, taken:false}  /* between girders 5 & 6, LEFT side, grabbed from the girder below */
];
var bgCv=document.getElementById('bg'),bgCtx=bgCv.getContext('2d');
var ovCv=document.getElementById('overlay'),ovCtx=ovCv.getContext('2d');
var stageEl=document.getElementById('stage');
var scoreEl=document.getElementById('score'),highEl=document.getElementById('high');
var levelEl=document.getElementById('level'),livesEl=document.getElementById('lives');
/* ===== STATE ===== */
var state='TITLE',stateT=0,paused=false;
var score=0,lives=3,high=0,level=1,cycles=0,extraAt=10000,newHigh=false;
var MAX_HEARTS=2,hearts=MAX_HEARTS;  /* per-stage health: 2 hearts, each enemy hit costs one */
var time=0,titleT=0;
var particles=[],floats=[];
var input={left:false,right:false,up:false,down:false};
var jumpQueued=false;
var marioBack=false;      /* after vaulting over a ladder, Mario stands with his back to the player (until he walks/jumps) */
var P=null;            /* player */
var barrels=[],monkeys=[],bananas=[];
var fires=[];               /* living barrel-sized fires: walk girders, climb ladders,
                               kill Mario on touch - born when the blue barrel hits the drum;
                               on level 5 each new girder reached spawns another (max MAX_FLAMES) */
var MAX_FLAMES=4;
var winFx={};               /* one-shot flags for the level-5 victory cutscene */
var blueNext=false;         /* the next barrel DK rolls is the blue one (first barrel of every stage) */
/* blue barrel route: rolls RIGHT off DK's girder -> falls off the edge onto
   the girder below and rolls LEFT -> hits the broken ladder and tumbles over
   it, dropping STRAIGHT DOWN through the middle girders to the bottom one ->
   rolls LEFT into the oil drum and explodes into the living fire */
var hammerHeld=false,hammerTime=0,hammerWarnT=0,dkThrowT=0,dkSpawnT=0,oilFx=0;
var hamImpactPrev=false;            /* edge-detects the hammer's impact frame for the jolt */
var dkAnim='idle',dkAnimT=0;             /* DK barrel-throw animation: idle -> turnL -> grab -> turnR -> roll */
var dkHold={x:92,y:190,visible:false};   /* the barrel DK is holding while he grabs / rolls it out */
var shakeT=0,shakeAmp=0,shakeX=0,shakeY=0;
function triggerShake(amp,dt){shakeAmp=amp;shakeT=dt;}
/* ===== STAGE 1 CLEAR CUTSCENE =====
   DK gets angry, walks over to Pauline, climbs up to her, grabs her and
   carries her UP the ladder to the top girder, then stomps three times.
   Each stomp landing shakes the screen, pops a chunk of the barrels still
   on the move (none survive the 3rd stomp) AND jostles Mario off two
   girders - after all 3 he's back at the very bottom, so the next stage
   starts another full climb to save Pauline. Then the stage fades out.
   No new barrels are thrown during the cutscene. */
var SC_T={angryEnd:0.55,walkAEnd:1.15,climbAEnd:1.90,walkBEnd:2.25,grabEnd:2.70,
          walkCEnd:3.10,climbBEnd:3.70,settleEnd:3.95,stompDur:0.62};
SC_T.stompEnd=SC_T.settleEnd+3*SC_T.stompDur; /* 3rd stomp has landed */
SC_T.fadeEnd=SC_T.stompEnd+0.75;              /* faded fully to black    */
var scT=0,scStomps=0,scFlags={grab:false};
function scLerp(a,b,k){return a+(b-a)*Math.max(0,Math.min(1,k));}
/* DK + Pauline world position (screen coords) at cutscene time T */
function scInfo(T){
  var S=SC_T,g5=GIRDS[5],g6=GIRDS[6],g7=GIRDS[7];
  var yB0=gy(g6,170);                       /* Pauline's girder (flat, y=150) */
  var yC1=gy(g7,215);                       /* top girder surface (y=92)      */
  var gx=PAULINE.x-6;                       /* DK stops just LEFT of Pauline  */
  var o={dkx:DKPOS.x,dky:gy(g5,DKPOS.x),px:PAULINE.x,py:gy(g6,PAULINE.x),
         carry:false,phase:'angry',hop:0};
  if(T<S.angryEnd){o.phase='angry';}
  else if(T<S.walkAEnd){                    /* walk along girder 5 to the ladder */
    o.phase='walk';
    o.dkx=scLerp(DKPOS.x,170,(T-S.angryEnd)/(S.walkAEnd-S.angryEnd));
    o.dky=gy(g5,o.dkx);
  }else if(T<S.climbAEnd){                  /* climb the x=170 ladder up to her */
    o.phase='climb';o.dkx=170;
    o.dky=scLerp(gy(g5,170),yB0,(T-S.walkAEnd)/(S.climbAEnd-S.walkAEnd));
  }else if(T<S.walkBEnd){                   /* step over to Pauline */
    o.phase='walk';
    o.dkx=scLerp(170,gx,(T-S.climbAEnd)/(S.walkBEnd-S.climbAEnd));
    o.dky=yB0;
  }else if(T<S.grabEnd){                    /* grab her! */
    o.phase='grab';o.dkx=gx;o.dky=yB0;
  }else if(T<S.walkCEnd){                   /* carry her over to the top ladder */
    o.phase='carry';o.carry=true;
    o.dkx=scLerp(gx,215,(T-S.grabEnd)/(S.walkCEnd-S.grabEnd));
    o.dky=yB0;
    o.px=o.dkx+9;o.py=o.dky+13;            /* held up beside him */
  }else if(T<S.climbBEnd){                  /* climb UP with her to the top girder */
    o.phase='climb';o.carry=true;o.dkx=215;
    o.dky=scLerp(yB0,yC1,(T-S.walkCEnd)/(S.climbBEnd-S.walkCEnd));
    o.px=o.dkx+9;o.py=o.dky+13;
  }else{
    o.phase=(T<S.settleEnd)?'settle':'stomp';
    o.dkx=215;o.dky=yC1;
    o.px=232;o.py=yC1;                     /* she stands on the top girder */
    if(T>=S.settleEnd){
      var stT2=T-S.settleEnd,ix=Math.floor(stT2/S.stompDur);
      if(ix<3)o.hop=Math.abs(Math.sin(Math.PI*((stT2-ix*S.stompDur)/S.stompDur)))*12;
    }
  }
  return o;
}
/* ===== PRE-LEVEL INTRO CUTSCENE (before EVERY level, incl. level 1) =====
   DK carries Pauline (freshly snatched) along his girder to the x=170
   ladder, climbs up one girder with her, carries her over to the x=215
   ladder and climbs to the VERY TOP of the building, then sets her down.
   Then "HOW HIGH CAN YOU GET?" pops up in 8-bit text with a jingle while
   bi-planes fly past in the background (King Kong style) - and the level
   begins. The stage-clear cutscene (stomping) still plays first; this is
   the little story beat AFTER it, before the level starts. */
var INTRO_T={walkAEnd:0.90,climbAEnd:1.80,walkBEnd:2.40,climbBEnd:3.30,
             settleEnd:3.90,planeStart:3.70,question:4.10,end:7.60};
var introT=0,introFx={jingle:false};
function introInfo(T){
  var S=INTRO_T,g5=GIRDS[5],g6=GIRDS[6],g7=GIRDS[7];
  var yA1=gy(g5,170),yB1=gy(g6,215),yC=gy(g7,215);
  var o={dkx:84,dky:gy(g5,84),px:93,py:gy(g5,84)+13,carry:true,phase:'carry',hop:0};
  if(T<S.walkAEnd){                        /* carry her along DK's girder to the ladder */
    o.dkx=scLerp(84,170,T/S.walkAEnd);o.dky=gy(g5,o.dkx);
    o.px=o.dkx+9;o.py=o.dky+13;
  }else if(T<S.climbAEnd){                 /* climb UP one girder with her */
    o.phase='climb';o.dkx=170;
    o.dky=scLerp(yA1,gy(g6,170),(T-S.walkAEnd)/(S.climbAEnd-S.walkAEnd));
    o.px=o.dkx+9;o.py=o.dky+13;
  }else if(T<S.walkBEnd){                  /* carry her over to the top ladder */
    o.dkx=scLerp(170,215,(T-S.climbAEnd)/(S.walkBEnd-S.climbAEnd));o.dky=gy(g6,215);
    o.px=o.dkx+9;o.py=o.dky+13;
  }else if(T<S.climbBEnd){                 /* climb to the very top of the building */
    o.phase='climb';o.dkx=215;
    o.dky=scLerp(yB1,yC,(T-S.walkBEnd)/(S.climbBEnd-S.walkBEnd));
    o.px=o.dkx+9;o.py=o.dky+13;
  }else{                                   /* set her down on the top girder - she waves */
    o.phase='settle';o.carry=false;
    o.dkx=215;o.dky=yC;o.px=234;o.py=yC;
  }
  return o;
}
/* WIN cutscene (clear level 5): Pauline is saved, DK tumbles off the building,
   lands knocked out cold, then the "GAME OVER - YOU WIN!" screen. */
var WIN_T={fallStart:1.1,fallEnd:2.2,winT:4.4};
function winInfo(T){
  var o={dkx:DKPOS.x,dky:gy(GIRDS[5],DKPOS.x),px:PAULINE.x,py:gy(GIRDS[6],PAULINE.x),
         rot:0,lying:false,hop:0,phase:'win'};
  if(T>=WIN_T.fallStart&&T<WIN_T.fallEnd){
    var k=(T-WIN_T.fallStart)/(WIN_T.fallEnd-WIN_T.fallStart);

  var left=barrels.length,shakesLeft=4-scStomps;

  for(var i=0;i<n;i++){
    spawnBurst(barrels[i].x,barrels[i].sy,['#c8893a','#8f5522','#ffd23e','#ffe9a0'],16);
  }
  if(n){barrels.splice(0,n);sfx.boom();}
}
function scFinish(){
  if(level>=5){startWin();return;}   /* safety net: L5 always ends in the win cutscene */
  if(level>=8){        /* all 4 stages done twice - intermission, then the next round */
    startIntermission();
    return;
  }
  level++;             /* next stage: L1-4 = stages 1-4, L5-8 = stages 1-4 again */
  resetPositions();
  startIntro();        /* intro cutscene (DK + Pauline up to the top), then the level begins */
}
function startIntermission(){

function skipInterm(){

/* --- PRE-LEVEL INTRO CUTSCENE: DK carries Pauline to the top, jingle, bi-planes, GO --- */

function addScore(n,x,y){

/* ===== PLAYER ===== */
function startClimb(L,dir){
  P.mode='climb';P.climb=L;P.climbDir=dir;
  P.x=L.x;hammerHeld=false;
}
function startJump(){
  /* HOP, not a high jump: apex = vy^2/(2*800) = 233^2/1600 = 33.9px (~32px in
     discrete integration) - just above the tallest enemy. A monkey's head is
     ~19px above the girder, so the jump is safe iff jumpY>=19 while |dx|<13.
     At 81.6px/s air speed the kill zone takes ~0.32s to cross and Mario
     stays above the 19px line for ~0.39s, so a well-timed jump clears it - air speed is decoupled from walk speed (mv is the difficulty knob).
     Floor for retuning: vy<~217 can't cover the zone at all, and below ~230
     the timing window gets razor-thin. */
  P.mode='jump';P.vy=233;P.jumpY=0;marioBack=false;
  sfx.jump();
}
function startFall(){
  P.mode='fall';P.vy=0;P.fallY=0;
  hammerHeld=false;
}
function updatePlayer(dt){
  var mv=74,cs=60,av=96;  /* Mario's difficulty knobs: mv = walk, cs = climb,
                            av*0.85 = jump air speed (kept high so jumps stay fair) */
  if(P.hurtT>0){P.hurtT-=dt;if(P.hurtT<0)P.hurtT=0;}  /* invulnerability/flash window after a hit */
  /* banana slip: no control while slipping - Mario flails, slides a little,
     and tumbles down a girder (a quick but costly delay) */
  var slipping=P.slipT>0;
  if(slipping){
    P.slipT-=dt;
    if(P.slipT<0)P.slipT=0;
    if(P.mode==='ground')P.x+=P.slipDir*30*dt;
  }
  var wantX=slipping?0:((input.left?-1:0)+(input.right?1:0));
  if(wantX){P.face=wantX;marioBack=false;}   /* walking again -> profile view returns */
  P.moving=(wantX!==0&&P.mode==='ground')||(slipping&&P.mode==='ground');
  if(P.mode==='ground'){
    if(wantX)P.x+=wantX*mv*dt;
    if(wantX)P.walk+=dt*11;
    P.y=gy(GIRDS[P.floor],P.x);
    var g=GIRDS[P.floor];
    if(P.x<g.x1+2||P.x>g.x2-2){
      startFall();
    }else{
      var L=ladderAt(P.floor,P.x);
      /* broken ladders: barrels roll down them, but Mario can never climb them (ladderAt skips broken) */
      if(!slipping&&input.up&&!hammerHeld&&L&&L.up>P.floor&&!L.broken){
        startClimb(L,1);
      }else if(!slipping&&input.down&&!hammerHeld&&L&&L.down<P.floor&&!L.broken){
        startClimb(L,-1);
      }else if(!slipping&&jumpQueued){
        /* jump always jumps - being next to a ladder must NOT start a climb
           (only holding UP/DOWN on a ladder climbs) */
        if(hammerHeld){hammerHeld=false;hammerTime=0;sfx.drop();}
        startJump();
      }
    }
  }else if(P.mode==='climb'){
    jumpQueued=false;  /* jump doesn't work on a ladder - don't let it stick for later */
    var L2=P.climb;
    P.x=L2.x;
    var topY=gy(GIRDS[L2.up],L2.x)+14;   /* ladder top = bottom of the girder (14px truss) */
    var botY=gy(GIRDS[L2.down],L2.x);
    P.moving=(input.up||input.down);
    if(input.up){
      P.y-=cs*dt;
      if(P.y<=topY){
        /* reached the top of the ladder: vault OVER onto the platform
           (leg over -> grip -> second leg over -> stand, see 'topclimb') */
        P.topY0=gy(GIRDS[L2.up],L2.x);   /* the platform surface the feet will end on */
        P.topFloor=L2.up;P.popT=0;P.mode='topclimb';
      }
    }else if(input.down){
      P.y+=cs*dt;
      if(P.y>=botY){P.y=botY;P.floor=L2.down;P.mode='ground';P.climb=null;marioBack=true;}
    }
    /* no up/down held => Mario stays exactly where he is on the ladder */
  }else if(P.mode==='topclimb'){
    /* real-world climb over the girder (no jumping):
       A) one leg lifts UP OVER the bar while an arm grabs hold of it,
       B) the other leg comes around over the bar - body weight on the arms,
       C) Mario pushes up, swings both legs down and stands on the platform */
    var TV=0.75;                          /* snappy vault: leg over -> grip -> second leg -> stand */
    P.popT+=dt;
    var kv=Math.min(1,P.popT/TV);
    P.y=P.topY0+14*(1-smooth01(kv));     /* rise from the ladder top to the surface */
    P.moving=true;
    if(kv>=1){
      P.y=P.topY0;P.floor=P.topFloor;P.mode='ground';P.climb=null;marioBack=true;
      P.walk=0;jumpQueued=false;
      sfx.land();
    }
  }else if(P.mode==='jump'){
    if(wantX)P.x+=wantX*av*0.85*dt;
    P.vy-=800*dt;
    P.jumpY+=P.vy*dt;
    if(P.vy<=0&&P.jumpY<=0){
      P.jumpY=0;P.mode='ground';
      sfx.land();
    }
  }else if(P.mode==='fall'){
    if(wantX)P.x+=wantX*av*0.5*dt;
    P.vy+=1000*dt;
    P.fallY+=P.vy*dt;
    var ay=P.y+P.fallY;
    var gi2=groundBelow(P.x,P.y+1);
    if(gi2>=0&&ay>=gy(GIRDS[gi2],P.x)){
      P.y=gy(GIRDS[gi2],P.x);P.floor=gi2;P.fallY=0;P.vy=0;P.mode='ground';
      sfx.land();
    }else if(ay>H+60){
      if(cheatMode){P.x=132;P.floor=0;P.y=gy(GIRDS[0],132);P.fallY=0;P.vy=0;P.mode='ground';}
      else killPlayer();
    }
  }
  /* pick up a static hammer the moment Mario's body touches it (each only once) */
  if(!hammerHeld){
    var hTop=playerScreenY()-28,hBot=playerScreenY();
    for(var hpi=0;hpi<HAMS.length;hpi++){
      var HM=HAMS[hpi];
      if(!HM.taken&&Math.abs(P.x-HM.x)<14&&HM.y>hTop&&HM.y<hBot){
        HM.taken=true;
        hammerHeld=true;hammerTime=8;hammerWarnT=0;
        marioBack=false;   /* turn to profile so the swing plane reads on screen */
        addFloat(HM.x,HM.y-18,'HAMMER!','#ffd23e');
        sfx.hammer();
        break;
      }
    }
  }
  if(P.x<8)P.x=8;
  if(P.x>412)P.x=412;
  jumpQueued=false;
}
/* ===== BARRELS ===== */
function barrelLadderAt(floor,xOld,xNew){
  for(var i=0;i<LADDS.length;i++){
    var L=LADDS[i];
    if(L.barrel&&L.up===floor){
      var crossed=(xOld<L.x&&xNew>=L.x)||(xOld>L.x&&xNew<=L.x);
      if(crossed)return L;
    }
  }
  return null;
}
function smooth01(k){return k*k*(3-2*k);}
function stackTop(){                      /* top barrel of the tall stack = DK's grab source */
  var s=BARREL_STACKS[BARREL_STACKS.length-1];
  var rows=(s.n>=4)?3:2;
  return {x:s.x,y:gy(GIRDS[5],s.x)-(BR+BR*1.7*(rows-1))};
}
/* DK barrel-throw, like the 1981 original: DK turns to face the stacks on his
   LEFT, lifts a barrel off the top stack, swings around to face RIGHT and
   rolls the barrel down the girder with his arm before it starts rolling */
function dkAnimUpdate(dt){
  var p=levelParams();
  if(dkAnim==='idle'){
    dkSpawnT-=dt;
    if(dkSpawnT<=0&&barrels.length<14){dkAnim='turnL';dkAnimT=0;dkHold.visible=false;}
    return;
  }
  dkAnimT+=dt;
  var hx=DKPOS.x+24;                      /* hand spot: DK's right, on the girder */
  if(dkAnim==='turnL'){
    if(dkAnimT>=DK_ANIM.turnL){dkAnim='grab';dkAnimT=0;}
  }else if(dkAnim==='grab'){
    dkHold.visible=true;
    var k=smooth01(Math.min(1,dkAnimT/DK_ANIM.grab));
    var top=stackTop();
    dkHold.x=top.x+(hx-top.x)*k;
    dkHold.y=top.y+((gy(GIRDS[5],hx)-BR)-top.y)*k;
    if(dkAnimT>=DK_ANIM.grab){dkAnim='turnR';dkAnimT=0;}
  }else if(dkAnim==='turnR'){
    dkHold.visible=true;
    dkHold.x=hx;dkHold.y=gy(GIRDS[5],hx)-BR;
    if(dkAnimT>=DK_ANIM.turnR){dkAnim='roll';dkAnimT=0;}
  }else if(dkAnim==='roll'){
    dkHold.visible=true;
    var k2=smooth01(Math.min(1,dkAnimT/DK_ANIM.roll));
    var rx=hx+(DKPOS.x+62-hx)*k2;
    dkHold.x=rx;dkHold.y=gy(GIRDS[5],rx)-BR;
    if(dkAnimT>=DK_ANIM.roll){
      /* release: the barrel starts rolling down the girder on its own */
      dkHold.visible=false;
      var isBlue=blueNext;blueNext=false;   /* the stage's first barrel is the blue one */
      /* blue barrel: released exactly like the others and rolls RIGHT down
         DK's girder (its scripted route is handled in updateBarrels) */
      barrels.push({x:rx,floor:5,dir:1,sy:gy(GIRDS[5],rx)-BR,state:'roll',vy:0,L:null,rot:0,bounced:false,blue:isBlue});
      sfx.dk();
      dkAnim='idle';
      dkSpawnT=p.gap*(0.8+Math.random()*0.4);
    }
  }
}
function updateBarrels(dt){
  var p=levelParams();
  if(state==='PLAYING')dkAnimUpdate(dt);  /* DK is busy with Pauline during the clear cutscene */
  if(dkThrowT>0)dkThrowT-=dt;
  var bsp=p.bsp;
  for(var i=barrels.length-1;i>=0;i--){
    var b=barrels[i];
    if(b.state==='roll'){
      /* roll along this girder's pitch (keeps its own way on flat girders) */
      var d=GIRDS[b.floor].dir||b.dir||-1;
      b.dir=d;
      var nx=b.x+d*bsp*dt;
      b.sy=gy(GIRDS[b.floor],b.x)-BR;
      if(b.floor===0&&b.x<=DRUM.x+10){
        b.rot-=(nx-b.x)/BR; /* spin for the travel into the oil drum */
        if(b.blue)blueHitDrum(i);else oilHit(i);
        continue;
      }
      var L=barrelLadderAt(b.floor,b.x,nx);
      if(L&&b.blue&&b.floor<5){
        /* blue barrel reaches the BROKEN LADDER: tumbles over it and drops
           STRAIGHT DOWN through the middle girders all the way to the bottom */
        b.rot-=(L.x-b.x)/BR;
        b.om=-(d*bsp)/BR;
        b.x=L.x;b.state='bdrop';b.vy=0;
      }else if(L&&Math.random()<1/3&&!b.blue){   /* blue ignores DK's top ladder and reaches the edge */
        b.rot-=(L.x-b.x)/BR; /* spin for the travel onto the broken ladder */
        b.om=-(d*bsp)/BR;   /* keep its angular momentum while sliding the ladder */
        b.x=L.x;b.state='ladder';b.L=L;
      }else if(nx<GIRDS[b.floor].x1+2||nx>GIRDS[b.floor].x2-2){
        b.rot-=(nx-b.x)/BR; /* spin for the travel off the girder edge */
        b.om=-(d*bsp)/BR;  /* keep its angular momentum while falling */
        b.x=nx;
        /* blue barrel falls off the edge like any other: bounces onto the
           girder below and picks up its new roll direction */
        b.state='fall';b.vy=0;b.bounced=false;
      }else{
        /* no-slip rolling: angle = distance / radius (BR px), signed so the
           barrel spins clockwise on screen when rolling RIGHT and
           counter-clockwise when rolling LEFT - matched to its travel */
        b.rot-=(nx-b.x)/BR;
        b.x=nx;
      }
    }else if(b.state==='ladder'){
      var dly=150*dt;      /* sliding down the ladder - keep spinning */
      b.sy+=dly;
      b.rot+=(b.om||0)*dt;
      var ty2=gy(GIRDS[b.L.down],b.L.x)-BR;
      if(b.sy>=ty2){
        b.sy=ty2;b.floor=b.L.down;b.state='roll';
        sfx.tick();
      }
    }else if(b.state==='bdrop'){
      /* blue barrel: drops STRAIGHT DOWN to the bottom girder (the one with
         the oil drum), passing the middle girders, then rolls left to it */
      b.vy+=900*dt;
      b.sy+=b.vy*dt;
      b.rot+=(b.om||0)*dt;
      var t0=gy(GIRDS[0],b.x)-BR;
      if(b.sy>=t0){
        b.sy=t0;b.floor=0;b.state='roll';b.vy=0;
        b.dir=GIRDS[0].dir||-1;
        sfx.tick();
      }
    }else if(b.state==='fall'){
      b.vy+=900*dt;
      var dly2=b.vy*dt;
      b.sy+=dly2;
      b.rot+=(b.om||0)*dt; /* keep spinning while falling */
      var gi3=groundBelow(b.x,GIRDS[b.floor].y+1);
      if(gi3>=0&&b.sy>=gy(GIRDS[gi3],b.x)-BR){
        if(!b.bounced&&b.vy>80){
          /* little bounce off the girder below: kick it upward, let it
             come back down, then settle into the roll on 2nd contact */
          b.bounced=true;
          b.sy=gy(GIRDS[gi3],b.x)-BR;
          b.vy=-120;
          if(GIRDS[gi3].dir)b.dir=GIRDS[gi3].dir;
          sfx.tick();
        }else{
          b.sy=gy(GIRDS[gi3],b.x)-BR;b.floor=gi3;b.state='roll';b.vy=0;
          if(GIRDS[gi3].dir)b.dir=GIRDS[gi3].dir;   /* new pitch flips the roll direction */
          sfx.tick();
        }
      }else if(gi3<0&&b.sy>H+30){
        barrels.splice(i,1);
        addScore(50,b.x,H-40);
      }
    }
  }
}
/* ===== MONKEYS =====
   L2  appear & pace their girder.
   L3+ climb ladders & roam other girders - RANDOM, they never follow Mario.
   L4+ leave banana skins on the girders (touch one and Mario slips).
   L5  also drop a banana ON Mario when a monkey is above him. */
function updateMonkeys(dt){
  var p=levelParams();
  for(var i=0;i<monkeys.length;i++){
    var m=monkeys[i];
    if(m.dead){
      m.rT-=dt;
      if(m.rT<=0){
        var f=(i%2===0)?2:3;
        m.floor=f;
        m.x=(GIRDS[f].dir>0)?GIRDS[f].x1+14:GIRDS[f].x2-14;
        m.climb=null;m.sy=null;
        m.dead=false;
      }
      continue;
    }
    if(m.climb){
      /* on a ladder: straight up or down (climbDir -1 = up, +1 = down) */
      var L3=m.climb;
      var tgt=(m.climbDir<0)?gy(GIRDS[L3.up],L3.x):gy(GIRDS[L3.down],L3.x);
      m.sy+=m.climbDir*95*dt;
      if((m.climbDir<0&&m.sy<=tgt)||(m.climbDir>0&&m.sy>=tgt)){
        m.sy=tgt;
        m.floor=(m.climbDir<0)?L3.up:L3.down;
        m.x=L3.x;
        m.climb=null;m.sy=null;
        sfx.drop();
      }
      continue;
    }
    var md=GIRDS[m.floor].dir||-1;   /* monkeys walk in their girder's roll direction */
    var xOld=m.x;
    m.x+=md*p.msp*dt;
    m.ph+=dt*9;
    /* L3+: crossed a ladder column? maybe climb to another girder (random - no chasing) */
    if(p.mclimb){
      for(var li=0;li<LADDS.length;li++){
        var Ld=LADDS[li];
        if(Ld.up!==m.floor&&Ld.down!==m.floor)continue;   /* ladder must touch this girder */
        if((xOld-Ld.x)*(m.x-Ld.x)<0&&Math.random()<0.5){
          var canUp=(Ld.up>m.floor),canDown=(Ld.down<m.floor);
          var cd=(canUp&&canDown)?(Math.random()<0.5?-1:1):(canUp?-1:1);
          m.climb=Ld;m.climbDir=cd;
          m.sy=gy(GIRDS[m.floor],Ld.x);
          m.x=Ld.x;
          sfx.drop();
          break;
        }
      }
      if(m.climb)continue;
    }
    if((md<0&&m.x<GIRDS[m.floor].x1+2)||(md>0&&m.x>GIRDS[m.floor].x2-2)){
      var gi4=groundBelow(m.x,GIRDS[m.floor].y+1);
      if(gi4>=0){
        m.floor=gi4;
      }else{
        m.dead=true;m.rT=3.5;
        spawnBurst(m.x,gy(GIRDS[m.floor],m.x)-10,['#9c642f','#e8c48a'],8);
      }
    }
    /* L4+: leave a banana skin on the girder (a slip trap for Mario) */
    if(p.mbanana){
      m.banT-=dt;
      if(m.banT<=0){
        m.banT=4+Math.random()*4;
        var bx=m.x+(Math.random()*24-12);
        if(bx>=GIRDS[m.floor].x1&&bx<=GIRDS[m.floor].x2){
          if(bananas.length>=9)bananas.shift();
          bananas.push({x:bx,floor:m.floor,fy:null,vy:0,t:0});
        }
      }
    }
    /* L5: drop a banana ON Mario when this monkey is above him */
    if(p.mdrop&&P&&!P.dead&&m.floor>P.floor){
      m.dropT-=dt;
      if(m.dropT<=0){
        m.dropT=3+Math.random()*3;
        if(Math.abs(m.x-P.x)<40){
          if(bananas.length>=9)bananas.shift();
          bananas.push({x:m.x,floor:null,fy:gy(GIRDS[m.floor],m.x)-12,vy:20,t:0});
          sfx.drop();
        }
      }
    }
  }
  updateBananas(dt);
}
/* Mario touches a banana: slips & falls (animated) - a quick but costly delay. */
function triggerSlip(){
  if(cheatMode||!P||P.dead)return;
  if(P.slipT>0)return;
  P.slipT=1.25;
  P.slipDir=(P.face>0)?1:-1;
  if(P.mode==='climb'||P.mode==='topclimb'){
    P.climb=null;P.mode='ground';P.y=gy(GIRDS[P.floor],P.x);
  }
  if(P.mode==='jump')P.vy=Math.min(P.vy,-40);
  if(P.floor>0&&P.mode==='ground')startFall();   /* the "fall" part of slip-and-fall */
  sfx.slip();
  addFloat(P.x,playerScreenY()-34,'SLIP!','#ffd23e');
  spawnBurst(P.x,playerScreenY()-4,['#ffd23e','#fff3c4','#e8c48a'],12);
}
/* ===== BANANAS (slip traps) ===== */
function updateBananas(dt){
  if(bananas.length===0)return;
  for(var i=bananas.length-1;i>=0;i--){
    var b=bananas[i];
    b.t+=dt;
    if(b.fy==null){
      /* resting on a girder: trips Mario if he walks into it at girder level */
      if(P&&!P.dead&&P.floor===b.floor&&Math.abs(b.x-P.x)<10&&playerScreenY()>gy(GIRDS[b.floor],b.x)-22){
        bananas.splice(i,1);
        triggerSlip();
      }
      continue;
    }
    /* falling (dropped at Mario) */
    var oy=b.fy;
    b.vy+=680*dt;
    b.fy+=b.vy*dt;
    var py=playerScreenY();
    if(P&&!P.dead&&Math.abs(b.x-P.x)<12&&b.fy>py-30&&b.fy<py+4){
      bananas.splice(i,1);
      triggerSlip();
      continue;
    }
    /* lands on the first girder below where it started */
    var gi5=groundBelow(b.x,oy+1);
    if(gi5>=0&&b.fy>=gy(GIRDS[gi5],b.x)){
      b.floor=gi5;b.fy=null;
    }else if(b.fy>H+40){
      bananas.splice(i,1);
    }
  }
}
function killMonkey(i){
  var m=monkeys[i];
  m.dead=true;m.rT=3.5;
  addScore(200,m.x,gy(GIRDS[m.floor],m.x)-40);
  spawnBurst(m.x,gy(GIRDS[m.floor],m.x)-14,['#9c642f','#e8c48a','#ffd23e'],16);
  triggerShake(4,0.25);
  sfx.monkey();
}
/* ===== HITS / DEATH ===== */
function playerScreenY(){
  return P.y-P.jumpY+P.fallY;
}
function checkHits(){
  var py=playerScreenY();
  var i;
  for(i=0;i<barrels.length;i++){
    var b=barrels[i];
    /* real body overlap: Mario's feet at py (~28px tall) vs barrel radius BR.
       This lets Mario jump over a barrel; he only dies on actual contact. */
    var mTop=py-28,mBot=py,bTop=b.sy-BR,bBot=b.sy+BR;
    if(mTop<bBot&&mBot>bTop){
      if(hammerHeld&&Math.abs(b.x-P.x)<20){
        spawnBurst(b.x,b.sy,['#c8893a','#8f5522','#ffd23e'],18);
        addScore(100,b.x,b.sy-22);
        triggerShake(5,0.3);
        sfx.smash();
        barrels.splice(i,1);
        i--;
      }else if(Math.abs(b.x-P.x)<13){
        hurtPlayer();
        return;
      }
    }
  }
  /* living fires: touching one kills Mario (same body-overlap rule as the
     barrels, so he can jump over it); a hammer swing puts it out.
     Up to MAX_FLAMES can be alive at once (level 5). */
  for(var fhi=0;fhi<fires.length;fhi++){
    var ff=fires[fhi];
    var fyf=(ff.sy==null)?gy(GIRDS[ff.floor],ff.x):ff.sy;
    var mT2=py-28,mB2=py,fTop=fyf-18,fBot=fyf+1;
    if(mT2<fBot&&mB2>fTop){
      if(hammerHeld&&Math.abs(ff.x-P.x)<22){
        spawnBurst(ff.x,fyf-8,['#ff9d2f','#ffd23e','#3ef5f5'],18);
        addScore(150,ff.x,fyf-24);
        triggerShake(5,0.3);
        sfx.smash();
        fires.splice(fhi,1);
        fhi--;
      }else if(Math.abs(ff.x-P.x)<14){
        hurtPlayer();
        return;
      }
    }
  }
  /* DK: touching Donkey Kong kills Mario (he guards girder 5 on every level) */
  var dkSurf=gy(GIRDS[5],DKPOS.x);
  if(Math.abs(P.x-DKPOS.x)<22&&py>dkSurf-46&&py-28<dkSurf){
    hurtPlayer();
    return;
  }
  for(i=0;i<monkeys.length;i++){
    var m=monkeys[i];
    if(m.dead)continue;
    var my=((m.sy!=null)?m.sy:gy(GIRDS[m.floor],m.x))-10;
    /* real body overlap (Mario ~28px tall, monkey ~18px tall) so Mario can
       cleanly JUMP OVER a monkey - he only dies on actual contact */
    var mkTop=my-9,mkBot=my+9;
    if(hammerHeld&&Math.abs(m.x-P.x)<22&&Math.abs(my-py)<34){
      killMonkey(i);
    }else if(Math.abs(m.x-P.x)<13&&mkTop<py&&mkBot>py-28){
      hurtPlayer();
      return;
    }
  }
}
function killPlayer(){
  if(cheatMode)return;                        /* cheat mode: invincible, no lives lost */
  if(P.mode==='dead')return;
  P.mode='dead';
  P.deadT=0;
  state='DYING';stateT=0;
  hammerHeld=false;
  musicMode('off');
  sfx.die();
  triggerShake(7,0.4);
  spawnBurst(P.x,playerScreenY()-14,['#ff5a3c','#ffd23e','#ffffff','#2a3fd4'],20);
}
/* An enemy hit costs ONE HEART, not a life: Mario flashes for ~2s (and is
   invulnerable while flashing) then carries on. When his last heart is
   spent he really dies. Hearts refill to MAX_HEARTS on every fresh stage. */
function hurtPlayer(){
  if(cheatMode)return;                        /* cheat mode: invincible */
  if(!P||P.mode==='dead')return;
  if(P.hurtT>0)return;                        /* still flashing from the last hit */
  if(hearts>1){
    hearts--;
    updateHearts();
    P.hurtT=2.0;                              /* ~2s of flashing + invulnerability */
    sfx.ouch();
    addFloat(P.x,playerScreenY()-44,'OUCH!','#ff6a4a');
    spawnBurst(P.x,playerScreenY()-14,['#ff5a3c','#ffffff','#ffd23e'],12);
    triggerShake(4,0.25);
  }else{
    hearts=0;updateHearts();
    killPlayer();                             /* out of hearts: real death */
  }
}

function blueHitDrum(i){

     barrel-sized fire is born at the drum and starts roaming */

  if(P.floor===0&&Math.abs(P.x-DRUM.x)<85)hurtPlayer();

/* ===== LIVING FIRE =====
   Raging fire that HUNTS Mario: patrols its girder (turning at the edges,
   never falling off), at every ladder - broken or not - rolls a climb die
   with a 50% base chance, raised to 75% when climbing takes it toward
   Mario's girder and cut to 25% when it takes it away. On landing a new
   girder it walks toward Mario's side of it 75% of the time.
   LEVEL 5: every time a flame reaches a new girder it spawns a copy -
   at most MAX_FLAMES are alive at any one time. */
function fireReachedGirder(f){
  if(level<5||fires.length>=MAX_FLAMES)return;
  fires.push({x:f.x,floor:f.floor,dir:(P.x>=f.x)?1:-1,state:'walk',
              sy:null,toY:0,toFloor:0,L:null,tried:{},ph:Math.random()*6});
  var fy=gy(GIRDS[f.floor],f.x);
  spawnBurst(f.x,fy-10,['#ff9d2f','#ffd23e','#ff5a00','#ffe9a0'],16);
  addFloat(f.x,fy-34,'FIRE SPREADS!','#ff9d2f');
}
function updateFires(dt){
  for(var fi=0;fi<fires.length;fi++){
    var f=fires[fi];
    f.ph+=dt*7;
    var clsp=110;               /* climbing speed (px/s) */
    var fsp=42;                  /* patrol speed (px/s) - constant, never speeds up */
    /* angry embers constantly spurt UP out of the fire (negative g = buoyant) */
    var fyy=(f.sy==null)?gy(GIRDS[f.floor],f.x):f.sy;
    if(Math.random()<dt*26){
      particles.push({
        x:f.x+(Math.random()*12-6),y:fyy-3-Math.random()*10,
        vx:(Math.random()*2-1)*16,vy:-(50+Math.random()*100),g:-110,
        life:0.35+Math.random()*0.55,t:0,size:1.5+Math.random()*2,
        color:['#ffd23e','#ff9d2f','#ff5a00','#ffe9a0'][(Math.random()*4)|0]
      });
    }
    if(f.state==='climb'){
      var d=(f.toY>f.sy)?1:-1;
      f.sy+=d*clsp*dt;
      if((d>0&&f.sy>=f.toY)||(d<0&&f.sy<=f.toY)){
        f.floor=f.toFloor;
        /* LANDED: release the pinned ladder height (sy=null) so the fire follows
           the NEW girder's surface line (gy()) as it walks - otherwise it would
           keep the old fixed Y and drift above/below pitched girders, dipping
           into the truss. Landing point is unchanged: gy(newGirder, ladderX)
           is exactly toY, so there's no visible pop. */
        f.sy=null;
        f.state='walk';f.L=null;
        /* hunting: on reaching a new girder, mostly pick the direction that
           heads toward where Mario is (75%) so it chases him across the level */
        var toward=(P.x>=f.x)?1:-1;
        f.dir=(Math.random()<0.75)?toward:(-toward);
        sfx.tick();
        fireReachedGirder(f);   /* L5: the fire spreads - a new flame is born */
      }
      continue;
    }
    var g=GIRDS[f.floor];
    var nx=f.x+f.dir*fsp*dt;
    /* never falls off a girder edge - clamps and reverses */
    if(nx<g.x1+4){nx=g.x1+4;if(f.dir<0)f.dir=1;}
    else if(nx>g.x2-4){nx=g.x2-4;if(f.dir>0)f.dir=-1;}
    /* ladder encounter (broken ladders included): 50% base climb chance,
       hunting-weighted - 75% when it climbs toward Mario's girder, 25% away;
       if it passes by, it retries that ladder after a 3s cooldown */
    for(var i=0;i<LADDS.length;i++){
      var L=LADDS[i];
      if(L.up!==f.floor&&L.down!==f.floor)continue;
      if((f.tried[i]||0)>time)continue;
      if(Math.abs(nx-L.x)<5){
        f.tried[i]=time+3;
        var mUp=(P.floor>f.floor),mDn=(P.floor<f.floor);
        var toUp=(L.down===f.floor);                       /* this ladder goes UP from here */
        var toward=(mUp&&toUp)||(mDn&&!toUp);              /* climb heads toward Mario's girder? */
        var chance=(mUp||mDn)?(toward?0.75:0.25):0.5;      /* 50% base, hunting bias on top */
        if(Math.random()<chance){
          var toF=(L.down===f.floor)?L.up:L.down;
          f.sy=gy(g,L.x);f.toY=gy(GIRDS[toF],L.x);f.toFloor=toF;
          f.x=L.x;f.L=L;f.state='climb';
          break;
        }
      }
    }
    if(f.state==='walk')f.x=nx;
  }
}
/* ===== FX (particles + floating score text) ===== */
function spawnBurst(x,y,colors,n){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,sp=40+Math.random()*160;
    particles.push({
      x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,g:260,
      life:0.5+Math.random()*0.6,t:0,size:2+Math.random()*4,
      color:colors[i%colors.length]
    });
  }
}
function addFloat(x,y,txt,color){
  floats.push({x:x,y:y,txt:txt,color:color,t:0});
}
function updateFX(dt){
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.t+=dt;
    if(p.t>=p.life){particles.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;
  }
  for(var j=floats.length-1;j>=0;j--){
    var f=floats[j];
    f.t+=dt;
    if(f.t>=1.2){floats.splice(j,1);continue;}
    f.y-=26*dt;
  }
}
/* ===== MAIN UPDATE (state machine) ===== */
function update(dt){
  updateFX(dt);
  if(state==='TITLE'){
    titleT+=dt;
    return;
  }
  if(state==='READY'){
    stateT-=dt;
    if(stateT<=0){
      state='PLAYING';
      musicMode('play');
    }
    return;
  }
  if(state==='INTRO'){
    introT+=dt;
    if(introT>=INTRO_T.question&&!introFx.jingle){
      introFx.jingle=true;
      sfx.jingle();
      sfx.plane();
    }
    if(introT>=INTRO_T.end)beginLevel();
    return;
  }
  if(state==='WIN'){
    stateT+=dt;
    if(stateT>=WIN_T.fallEnd&&!winFx.land){
      winFx.land=true;
      spawnBurst(56,gy(GIRDS[0],56)-8,['#c9c9d8','#8f8fa0','#ffd23e','#e8c48a'],28);
      triggerShake(9,0.5);
      sfx.dk();sfx.smash();
    }
    if(stateT>=WIN_T.winT&&!winFx.j){winFx.j=true;sfx.win();}
    if(stateT>0.4&&Math.random()<dt*2.5){
      var hx=(P.x+PAULINE.x)/2;
      spawnBurst(hx,gy(GIRDS[6],hx)-36,['#ff7bac','#ffb3cd','#ffffff'],4);
    }
    return;
  }
  if(state==='STAGECLEAR'){
    scT+=dt;
    if(!scFlags.grab&&scT>=SC_T.grabEnd){scFlags.grab=true;sfx.grab();}
    updateBarrels(dt);   /* whatever is rolling keeps rolling - DK throws no new barrels */
    updateMonkeys(dt);
    if(scT>=SC_T.settleEnd){
      var sl=Math.floor((scT-SC_T.settleEnd)/SC_T.stompDur);
      if(sl>scStomps&&sl<=3)scStomp();     /* 3 stomp landings = 3 shakes + barrel pops */
    }
    if(scT>=SC_T.fadeEnd)scFinish();
    return;
  }
  if(state==='PLAYING'){
    if(oilFx>0)oilFx-=dt;
    updatePlayer(dt);
    if(state!=='PLAYING')return;
    if(hammerHeld){
      hammerTime-=dt;
      if(hammerTime<=0){
        hammerHeld=false;hammerTime=0;
        sfx.drop();
      }else if(hammerTime<=2.5){
        hammerWarnT-=dt;
        if(hammerWarnT<=0){hammerWarnT=0.45;sfx.hammerWarn();}
      }
    }
    updateBarrels(dt);
    if(state!=='PLAYING')return;
    updateMonkeys(dt);
    if(state!=='PLAYING')return;
    updateFires(dt);
    if(state!=='PLAYING')return;
    checkHits();
    if(state!=='PLAYING')return;
    if(P.floor===6&&P.x<=KISS_X){       /* kiss spot is on the LEFT, where Pauline stands */
      levelClear();
      return;
    }
    if(Math.random()<dt*0.12){
      addFloat(PAULINE.x,PAULINE.y-46,'HELP!','#ff9ecb');
    }
    return;
  }
  if(state==='DYING'){
    P.deadT+=dt;
    if(P.deadT>2.0){
      lives--;
      updateLives();
      if(lives<=0){
        state='GAMEOVER';stateT=0;
        sfx.gameover();
      }else{
        resetPositions();
        state='READY';stateT=2.4;
        sfx.ready();
      }
    }
    return;
  }
  if(state==='GAMEOVER'){
    stateT+=dt;
    if(stateT>9)toTitle();
    return;
  }
  if(state==='INTERM'){
    stateT+=dt;
    if(stateT>6)nextCycle();
    return;
  }
}
/* ===== 2D RENDERING ===== */
function paintBG(){
  var g=bgCtx;
  g.clearRect(0,0,W,H);
  var gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,'#070716');gr.addColorStop(0.6,'#0c1030');gr.addColorStop(1,'#141a3f');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  for(var i=0;i<70;i++){
    var x=(i*97)%W,y=(i*53)%380+8,s=(i%3)*0.5+0.5;
    g.fillStyle='rgba(255,255,255,'+(0.2+((i*13)%10)/25)+')';
    g.fillRect(x,y,s,s);
  }
  g.fillStyle='#f4f1d8';
  g.beginPath();g.arc(352,54,17,0,7);g.fill();
  g.fillStyle='rgba(160,150,110,0.35)';
  g.beginPath();g.arc(346,48,4,0,7);g.fill();
  g.beginPath();g.arc(358,60,3,0,7);g.fill();
  /* city silhouette behind the girders */
  var bld=[[0,95,58],[66,130,52],[126,80,64],[198,145,58],[264,100,60],[332,125,88]];
  for(var b=0;b<bld.length;b++){
    var bx=bld[b][0],bw=bld[b][1]?0:0;
    (function(x,h,w){
      g.fillStyle='#0a0d22';
      g.fillRect(x,H-h-8,w,h+8);
      g.fillStyle='#1a2148';
      for(var wy=H-h+8;wy<H-18;wy+=16){
        for(var wx=x+6;wx<x+w-8;wx+=14){
          if(((wx*7+wy*13)%17)<9){g.fillRect(wx,wy,5,7);}
        }
      }
    })(bld[b][0],bld[b][1],bld[b][2]);
  }
  /* girder + ladder outlines (also the no-WebGL fallback world) */
  /* 1930s truss girders: thin metal bars on top & bottom with a tall open
     X lattice between them (big dark spaces, thin X lines) */
  for(var gi=0;gi<GIRDS.length;gi++){
    var gg=GIRDS[gi];
    var n=Math.max(1,Math.round((gg.x2-gg.x1)/14));      /* number of X cells */
    var c0=(gg.x1+gg.x2)/2-n*7;                          /* lattice left edge  */
    var c1=gg.x2-c0;                                     /* lattice right edge */
    g.strokeStyle='#ff6a8f';g.lineWidth=2;
    g.beginPath();
    g.moveTo(c0,gy(gg,c0)+1);g.lineTo(c1,gy(gg,c1)+1);      /* thin top bar    (gy+0..gy+2)   - ends at the outer X edges */
    g.moveTo(c0,gy(gg,c0)+13);g.lineTo(c1,gy(gg,c1)+13);    /* thin bottom bar (gy+12..gy+14) */
    g.stroke();
    g.strokeStyle='#ff4d7d';g.lineWidth=1.5;
    g.beginPath();
    for(var sx=c0;sx<c1;sx+=14){                                        /* X lattice between the bars */
      var sxe=sx+14;
      var aT=gy(gg,sx)+2,aB=gy(gg,sx)+12,bT=gy(gg,sxe)+2,bB=gy(gg,sxe)+12;
      g.moveTo(sx,aT);g.lineTo(sxe,bB);
      g.moveTo(sxe,bT);g.lineTo(sx,aB);
    }
    g.stroke();
  }
  /* ladders: arcade cyan - broken ones have their middle rungs AND a piece of
     both side rails cut out, so the player can see they're broken */
  g.lineWidth=2;
  g.strokeStyle='#3ef5f5';
  for(var li=0;li<LADDS.length;li++){
    var L=LADDS[li];
    var y2=gy(GIRDS[L.down],L.x);                        /* foot at the TOP of the lower girder */
    var y1=gy(GIRDS[L.up],L.x)+14;                       /* top at the BOTTOM of the upper girder (14px truss) */
    var mid=(y1+y2)/2,cut=12;                            /* height of the cut-out zone (2 middle rungs) */
    g.beginPath();
    if(L.broken){
      g.moveTo(L.x-5,y1);g.lineTo(L.x-5,mid-cut);        /* left rail, middle chunk missing  */
      g.moveTo(L.x-5,mid+cut);g.lineTo(L.x-5,y2);
      g.moveTo(L.x+5,y1);g.lineTo(L.x+5,mid-cut);        /* right rail, middle chunk missing */
      g.moveTo(L.x+5,mid+cut);g.lineTo(L.x+5,y2);
    }else{
      g.moveTo(L.x-5,y1);g.lineTo(L.x-5,y2);
      g.moveTo(L.x+5,y1);g.lineTo(L.x+5,y2);
    }
    for(var ri=1;ri<=4;ri++){                            /* 4 evenly-spaced rungs */
      var ry=y1+(y2-y1)*ri/5;
      if(L.broken&&Math.abs(ry-mid)<cut)continue;        /* middle rungs cut out */
      g.moveTo(L.x-6,ry);g.lineTo(L.x+6,ry);
    }
    g.stroke();
  }
}
function drawPlanes(){
  /* WWI-style bi-planes patrol the sky (King Kong overfly): propeller disc
     out front, two wings stacked one above the other with struts, tail fin.
     Drawn on the BACKGROUND canvas so they fly BEHIND the girders and the
     3D characters - during the intro AND as ambience while playing. */
  var defs=[
    {y:40,sp:60,delay:0,   s:1,    ph:0},
    {y:66,sp:46,delay:1.6, s:0.72, ph:2.4}
  ];
  for(var i=0;i<defs.length;i++){
    var d=defs[i];
    var lt=time-d.delay;
    if(lt<0)continue;
    var span=W+160;
    var x=((lt*d.sp)%span)-80;
    drawBiplane(bgCtx,x,d.y+Math.sin(lt*1.6+d.ph)*3.5,d.s);
  }
}
function drawBiplane(g,x,y,s){
  /* 2D fallback: Sopwith Camel side profile, nose LEFT, like the reference photo */
  g.save();
  g.translate(x,y);g.scale(s,s);
  var olive='#6b6046',oliveD='#4f452f',white='#e8e6df',silver='#c9c7bd',tan='#b5722f';
  var u2=0.36;
  function mrect2(cx,cy,w,h,oxp){g.fillRect(oxp+cx*u2,(2.5-cy-h)*u2,w*u2,h*u2);}
  /* tan N-struts */
  g.strokeStyle=tan;g.lineWidth=1.4;
  g.beginPath();
  g.moveTo(-4,-3.2);g.lineTo(-4,-5.9);
  g.moveTo(3,-3.2);g.lineTo(3,-5.9);
  g.moveTo(-2,1.8);g.lineTo(-2,4.4);
  g.moveTo(3,1.8);g.lineTo(3,4.4);
  g.stroke();
  /* TOP wing: long ribbed olive fabric wing */
  g.fillStyle=olive;
  g.fillRect(-8.5,-8.2,16,2.4);
  g.fillStyle=oliveD;
  g.fillRect(-3,-8.4,4.5,2.8);                       /* darker center section */
  for(var ri=0;ri<5;ri++)g.fillRect(-7.5+ri*3,-8.3,0.35,2.6);  /* fabric ribs */
  /* wing roundels (blue / white / red) */
  g.fillStyle='#2b3f7e';g.beginPath();g.arc(1.5,-7,1.7,0,7);g.fill();
  g.fillStyle=white;g.beginPath();g.arc(1.5,-7,1.15,0,7);g.fill();
  g.fillStyle='#b3282d';g.beginPath();g.arc(1.5,-7,0.6,0,7);g.fill();
  /* BOTTOM wing: much smaller */
  g.fillStyle=olive;
  g.fillRect(-3.5,4.8,10,1.8);
  g.fillStyle='#2b3f7e';g.beginPath();g.arc(-1,5.7,1.2,0,7);g.fill();
  g.fillStyle=white;g.beginPath();g.arc(-1,5.7,0.8,0,7);g.fill();
  g.fillStyle='#b3282d';g.beginPath();g.arc(-1,5.7,0.4,0,7);g.fill();
  /* single spoked wheel, white hub */

      g.fillStyle='#666d78';
      g.fillRect(ex-5,ey-4,10,8);
