<script>
(function(){
'use strict';
/* ================= WORLD / CONSTANTS ================= */
var W=420,H=600,HW=210,HH=300;
var PLAYER_Y=-235,PLAYER_SPEED=265,PLAYER_R=11;
var MAX_LASERS=2,LASER_SPEED=950,FIRE_CD=0.26;
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function loadHi(){try{return +(localStorage.getItem('aiarcade_galaga_hi')||0);}catch(e){return 0;}}
function saveHi(){try{localStorage.setItem('aiarcade_galaga_hi',String(G.hi));}catch(e){}}
/* Global game state */
var G={state:'MENU',score:0,hi:loadHi(),lives:3,level:1,time:0,
       introT:0,clearT:0,dyingT:0,attackT:2,fireT:2,beamCap:0,vBonus:0,fireCd:0};
var player={group:null,x:0,alive:false,invuln:0,respawnT:0};
var enemies=[],lasers=[],ebullets=[],bursts=[],starLayers=[];
/* DOM refs */
var stageEl=document.getElementById('stage');
var ovEl=document.getElementById('ov');
var elScore=document.getElementById('score');
var elHi=document.getElementById('high');
var elLvl=document.getElementById('lvl');
var elLives=document.getElementById('lives');
var pauseBtn=document.getElementById('pauseBtn');
var restartBtn=document.getElementById('restartBtn');
var muteBtn=document.getElementById('muteBtn');
var joyBase=document.getElementById('joyBase');
var joyKnob=document.getElementById('joyKnob');
var joyStick=document.getElementById('joyStick');
var fireBtn=document.getElementById('fireBtn');
/* ================= PROCEDURAL AUDIO (Web Audio API, no files) ================= */
function SoundEngine(muted){
  this.ctx=null; this.master=null; this._noise=null; this._beam=null;
  this.muted=!!muted;
}
SoundEngine.prototype.ensure=function(){
  if(!this.ctx){
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return false;
    this.ctx=new AC();
    this.master=this.ctx.createGain();
    this.master.gain.value=this.muted?0:0.55;
    this.master.connect(this.ctx.destination);
    var len=Math.floor(this.ctx.sampleRate*1.2);
    var buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
    this._noise=buf;
  }
  if(this.ctx.state==='suspended') this.ctx.resume();
  return true;
};
SoundEngine.prototype.laserSound=function(){
  if(!this.ensure()) return;
  var t=this.ctx.currentTime;
  var o=this.ctx.createOscillator(); o.type='square';
  o.frequency.setValueAtTime(880,t);
  o.frequency.exponentialRampToValueAtTime(220,t+0.16);
  var g=this.ctx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.20,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
  o.connect(g); g.connect(this.master);
  o.start(t); o.stop(t+0.2);
};
SoundEngine.prototype.explosionSound=function(type){
  if(!this.ensure()) return;
  var big=(type==='big');
  var dur=big?0.9:0.45;
  var t=this.ctx.currentTime;
  var src=this.ctx.createBufferSource(); src.buffer=this._noise; src.loop=true;
  var f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.Q.value=1.2;
  f.frequency.setValueAtTime(big?900:2400,t);
  f.frequency.exponentialRampToValueAtTime(55,t+dur);
  var g=this.ctx.createGain();
  g.gain.setValueAtTime(big?0.55:0.35,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f); f.connect(g); g.connect(this.master);
  src.start(t); src.stop(t+dur+0.05);
};
SoundEngine.prototype.divingSound=function(){
  if(!this.ensure()) return;
  var t=this.ctx.currentTime;
  var o=this.ctx.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(650,t);
  o.frequency.linearRampToValueAtTime(360,t+0.7);
  var lfo=this.ctx.createOscillator(); lfo.type='sine'; lfo.frequency.value=11;
  var lg=this.ctx.createGain(); lg.gain.value=95;
  lfo.connect(lg); lg.connect(o.frequency);
  var g=this.ctx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.10,t+0.06);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.75);
  o.connect(g); g.connect(this.master);
  o.start(t); lfo.start(t); o.stop(t+0.8); lfo.stop(t+0.8);
};
SoundEngine.prototype.jingle=function(){
  if(!this.ensure()) return;
  var notes=[392.0,523.25,659.25,783.99,1046.5];
  var base=this.ctx.currentTime+0.02;
  for(var i=0;i<notes.length;i++){
    var t=base+i*0.09;
    var o=this.ctx.createOscillator(); o.type='square'; o.frequency.value=notes[i];
    var g=this.ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.16,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+0.16);
  }
};
SoundEngine.prototype.beamStart=function(){
  if(!this.ensure()) return;
  this.beamStop();
  var t=this.ctx.currentTime, nodes=[];
  for(var i=0;i<2;i++){
    var o=this.ctx.createOscillator(); o.type='sine'; o.frequency.value=i===0?392:415.3;
    var lfo=this.ctx.createOscillator(); lfo.type='sine'; lfo.frequency.value=4.5;
    var lg=this.ctx.createGain(); lg.gain.value=10;
    lfo.connect(lg); lg.connect(o.frequency);
    var g=this.ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.055,t+0.25);
    o.connect(g); g.connect(this.master);
    o.start(t); lfo.start(t);
    nodes.push(o,lfo,g);
  }
  this._beam=nodes;
};
SoundEngine.prototype.beamStop=function(){
  if(!this._beam||!this.ctx){ this._beam=null; return; }
  var t=this.ctx.currentTime;
  var nodes=this._beam; this._beam=null;
  for(var i=0;i<nodes.length;i++){
    var n=nodes[i];
    if(n.gain) n.gain.setTargetAtTime(0.0001,t,0.04);
    try{ n.stop(t+0.25); }catch(e){}
  }
  (function(ns){
    setTimeout(function(){ for(var i=0;i<ns.length;i++){ try{ns[i].disconnect();}catch(e){} } },350);
  })(nodes);
};
SoundEngine.prototype.muteToggle=function(){
  this.muted=!this.muted;
  if(this.ctx&&this.master) this.master.gain.setTargetAtTime(this.muted?0:0.55,this.ctx.currentTime,0.02);
  return this.muted;
};
var soundMutedInit=false;
try{ soundMutedInit=(localStorage.getItem('aiarcade-muted')==='1'); }catch(e){}
var sound=new SoundEngine(soundMutedInit);
if(soundMutedInit) muteBtn.textContent='🔇';
/* ================= THREE.JS SCENE (orthographic top-down) ================= */
var renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(W,H,false);
renderer.setClearColor(0x02020e,1);
var scene=new THREE.Scene();
var camera=new THREE.OrthographicCamera(-HW,HW,HH,-HH,0.1,300);
camera.position.set(0,0,60);
camera.lookAt(0,0,0);
scene.add(new THREE.AmbientLight(0xffffff,0.9));
var dl=new THREE.DirectionalLight(0xffffff,0.35); dl.position.set(0,0,1); scene.add(dl);
var clock=new THREE.Clock();
/* Procedural round sprite texture (canvas-generated) for stars & particles */
var dotTex=(function(){
  var c=document.createElement('canvas'); c.width=c.height=64;
  var x=c.getContext('2d');
  var grd=x.createRadialGradient(32,32,0,32,32,32);
  grd.addColorStop(0,'rgba(255,255,255,1)');
  grd.addColorStop(0.45,'rgba(255,255,255,.85)');
  grd.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=grd; x.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
})();
/* Multi-layer parallax starfield (scrolls down at varying speeds) */
function starLayer(n,speed,size,color,opacity){
  var pos=new Float32Array(n*3);
  for(var i=0;i<n;i++){
    pos[i*3]=(Math.random()*2-1)*HW;
    pos[i*3+1]=(Math.random()*2-1)*HH;
    pos[i*3+2]=-1;
  }
  var geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  var m=new THREE.PointsMaterial({size:size,color:color,transparent:true,opacity:opacity,map:dotTex,depthWrite:false});
  scene.add(new THREE.Points(geo,m));
  starLayers.push({geo:geo,n:n,speed:speed});
}
starLayer(110,16,2,0x8f9bff,0.75);
starLayer(70,42,3.2,0xdfe8ff,0.9);
starLayer(46,85,4.6,0xffffff,1.0);
function updateStars(dt){
  for(var li=0;li<starLayers.length;li++){
    var L=starLayers[li], p=L.geo.attributes.position;
    for(var i=0;i<L.n;i++){
      var y=p.getY(i)-L.speed*dt;
      if(y<-HH-6) y+=2*HH+12;
      p.setY(i,y);
    }
    p.needsUpdate=true;
  }
}
/* Shared geometries / materials for projectiles (reused across entities) */
var laserCoreGeo=new THREE.BoxGeometry(2.5,16,2);
var laserGlowGeo=new THREE.BoxGeometry(6,20,3);
var laserCoreMat=new THREE.MeshBasicMaterial({color:0xeaffff});
var laserGlowMat=new THREE.MeshBasicMaterial({color:0x3ef5f5,transparent:true,opacity:0.35,blending:THREE.AdditiveBlending,depthWrite:false});
var ebCoreGeo=new THREE.BoxGeometry(4.5,8,3);
var ebGlowGeo=new THREE.BoxGeometry(9,13,3);
var ebCoreMat=new THREE.MeshBasicMaterial({color:0xff6a6a});
var ebGlowMat=new THREE.MeshBasicMaterial({color:0xff2a2a,transparent:true,opacity:0.4,blending:THREE.AdditiveBlending,depthWrite:false});
/* ================= SHIP BUILDERS (procedural low-poly meshes) ================= */
var matCache={},geoCache={};
function mat(c){ if(!matCache[c]) matCache[c]=new THREE.MeshBasicMaterial({color:c}); return matCache[c]; }
function B(w,h,d,c){
  var k=w+'x'+h+'x'+d;
  if(!geoCache[k]) geoCache[k]=new THREE.BoxGeometry(w,h,d);
  return new THREE.Mesh(geoCache[k],mat(c));
}
function at(m,x,y,z){ m.position.set(x||0,y||0,z||0); return m; }
/* Wing on a pivot group so it can flap (rotate) every frame */
function wingPivot(g,w,h,d,c,s){
  var p=new THREE.Group();
  p.position.set(s*4,0,0);
  var m=B(w,h,d,c); m.position.set(s*(w/2+3),0,0);
  p.add(m); g.add(p);
  return p;
}
function buildPlayer(){
  var g=new THREE.Group();
  g.add(B(7,24,7,0xffffff));                    /* white fuselage */
  g.add(at(B(3.5,10,3.5,0xffffff),0,-17,0));   /* nose */
  g.add(at(B(30,9,3,0xffffff),0,5,0));         /* wing bar */
  g.add(at(B(6,9,5,0xff2a2a),-15,5,0));        /* red wingtip */
  g.add(at(B(6,9,5,0xff2a2a),15,5,0));         /* red wingtip */
  g.add(at(B(4.5,7,4.5,0x3ef5f5),0,-3,0));     /* glowing blue cockpit */
  g.add(at(B(5,5,3,0xffa52e),0,13,0));         /* engine block */
  var pl=new THREE.PointLight(0x3ef5f5,0.8,90);
  pl.position.set(0,-2,6);
  g.add(pl);
  g.userData.baseScale=1;
  return g;
}
function buildZako(){
  var g=new THREE.Group();
  g.add(B(6,15,6,0xffd23e));
  g.add(at(B(4,6,4,0xffffff),0,-11,0));
  g.add(at(B(4,5,4,0x3b6bff),0,10,0));
  g.userData.flaps=[wingPivot(g,10,2.5,3,0x3b6bff,1),wingPivot(g,10,2.5,3,0x3b6bff,-1)];
  g.userData.baseScale=1;
  return g;
}
function buildGoei(){
  var g=new THREE.Group();
  g.add(B(6,18,6,0xff3b3b));
  g.add(at(B(5,6,5,0x3ef5f5),0,-12,0));
  g.add(at(B(4,5,4,0xffffff),0,11,0));
  g.userData.flaps=[wingPivot(g,12,8,2,0xffffff,1),wingPivot(g,12,8,2,0xffffff,-1)];
  g.userData.baseScale=1;
  return g;
}
function buildBoss(sc){
  var g=new THREE.Group();
  g.add(B(9,24,9,0x39d353));

function cfgLevel(){ return LEVELS[Math.min(LEVELS.length,Math.max(1,G.level))-1]; }
function rowYs(n){ if(n===3) return [195,148,101]; if(n===2) return [188,140]; return [180]; }
function spawnEnemy(type,fx,fy,delay){

         phase:Math.random()*6.28,hp:def.hp,noReturn:false,

function buildFormation(){
  clearEnemies();
  var cfg=cfgLevel();
  var ys=rowYs(cfg.rows.length);
  for(var ri=0;ri<cfg.rows.length;ri++){
    var type=cfg.rows[ri][0], count=cfg.rows[ri][1];

      spawnEnemy(type,x,ys[ri],ri*0.55+ci*0.12);

/* Smooth entry from off-screen top/side via cubic Bezier */
function startEntry(e){
  var side=Math.random()<0.5?-1:1;
  var top=Math.random()<0.55;
  var p0,p1,p2,p3={x:e.fx,y:e.fy};
  if(top){
    p0={x:e.fx+side*(120+Math.random()*80),y:HH+80};
    p1={x:p0.x+side*60,y:HH+10};
    p2={x:e.fx-side*100,y:90+Math.random()*40};
  } else {
    p0={x:side>0?HW+90:-HW-90,y:120+Math.random()*160};
    p1={x:side>0?HW+20:-HW-20,y:260};
    p2={x:e.fx-side*120,y:e.fy+120};
  }
  e.path=[p0,p1,p2,p3];
  e.t=0;
  e.dur=2.2+Math.random()*0.4;
  e.state='ENTER';
}
/* After a dive-bomb, loop back from off-screen to the formation slot */
function startReturn(e){
  var side=Math.random()<0.5?-1:1;
  e.path=[
    {x:side>0?HW+100:-HW-100,y:-HH-60},
    {x:side>0?HW+30:-HW-30,y:20},
    {x:e.fx+side*150,y:e.fy+100},
    {x:e.fx,y:e.fy}
  ];
  e.t=0;
  e.dur=2.0;
  e.state='RETURN';
}
function bez(e,t){
  var p=e.path, u=1-t;
  function c(a){
    var k=u*u*u, l=3*u*u*t, m=3*u*t*t, n=t*t*t;
    return a[0]*k+a[1]*l+a[2]*m+a[3]*n;
  }
  e.x=c([p[0].x,p[1].x,p[2].x,p[3].x]);
  e.y=c([p[0].y,p[1].y,p[2].y,p[3].y]);
  if(e.spiral) e.x+=Math.sin(t*Math.PI*4+e.phase)*26; /* corkscrew wobble */
  e.group.position.set(e.x,e.y,1);
}
function removeEnemy(i){
  scene.remove(enemies[i].group);
  enemies.splice(i,1);
}
function clearEnemies(){
  for(var i=0;i<enemies.length;i++) scene.remove(enemies[i].group);
  enemies.length=0;
}
/* ================= ENEMY UPDATE (formation / dive / beam / return) ================= */
function updateEnemies(dt){
  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    switch(e.state){
      case 'WAIT':
        e.delay-=dt;
        if(e.delay<=0) startEntry(e);
        break;
      case 'ENTER':
        e.t+=dt/e.dur;
        if(e.t>=1){ e.state='FORM'; e.x=e.fx; e.y=e.fy; e.group.position.set(e.fx,e.fy,1); }
        else bez(e,e.t);
        break;
      case 'FORM':
        e.group.position.y=e.fy+Math.sin(G.time*1.7+e.phase)*3;
        break;
      case 'DIVE':
        e.t+=dt/e.dur;
        if(e.t>=1){
          if(e.noReturn){ if(e.y<-330){ removeEnemy(i); continue; } }
          else { startReturn(e); continue; }
        }
        bez(e,Math.min(e.t,1));
        if(e.willBeam && e.t>=0.55){
          e.willBeam=false;
          e.state='CAPTURE';
          e.capT=2.0;
          G.beamCap=0;
          startBeam(e);
        }
        break;
      case 'RETURN':
        e.t+=dt/e.dur;
        if(e.t>=1){ e.state='FORM'; e.x=e.fx; e.y=e.fy; }
        else bez(e,e.t);
        break;
      case 'CAPTURE':
        e.capT-=dt;
        e.group.position.y=e.y+Math.sin(G.time*3)*2;
        if(player.alive){
          var bw=e.def.beamW||22;
          if(Math.abs(player.x-e.x)<bw) G.beamCap=Math.min(1,G.beamCap+dt/0.8);
          else G.beamCap=Math.max(0,G.beamCap-dt*1.2);
          if(G.beamCap>=1) capturePlayer();
        }
        if(e.capT<=0||!player.alive||!beam.on){
          endBeam();
          e.state='DIVE';
          e.t=Math.max(e.t,0.62);
          e.dur=Math.max(0.9,e.dur*0.5);
        }
        break;
    }
    /* Wing flap + body pulse + hit flash animations */
    var fl=e.group.userData.flaps;
    if(fl){
      var s=Math.sin(G.time*11+e.phase)*0.55;
      fl[0].rotation.y=s;
      if(fl[1]) fl[1].rotation.y=s;
    }
    if(e.flash>0){
      e.flash-=dt;
      e.group.scale.setScalar(e.baseScale*1.3);
    } else {
      e.group.scale.setScalar(e.baseScale*(e.def.pulse?(1+0.07*Math.sin(G.time*6+e.phase)):1));
    }
  }
}
/* ================= ATTACK DIRECTOR (per-level dive behaviors) ================= */
function director(dt){
  if(G.attackT>0){ G.attackT-=dt; return; }
  var cfg=cfgLevel();
  var pool=[];
  for(var i=0;i<enemies.length;i++){
    if(enemies[i].state==='FORM'||enemies[i].state==='ENTER') pool.push(enemies[i]);
  }
  if(!pool.length){ G.attackT=0.9; return; }
  var pick=function(){ return pool[(Math.random()*pool.length)|0]; };
  function doDive(e,opts){
    opts=opts||{};
    var s={x:e.x,y:e.y};
    var d0=e.fx<0?-1:1;
    var aim=(opts.aim!=null)?opts.aim:(player.x+(Math.random()-0.5)*140);
    if(opts.row){
      var ex=(e.fx<player.x)?-HW-140:HW+140;
      e.path=[s,{x:s.x+d0*30,y:s.y-40},{x:aim*0.7+d0*80,y:-40},{x:ex,y:-360}];
    } else {
      e.path=[
        s,
        {x:s.x+d0*(50+Math.random()*40),y:s.y-60},
        {x:aim+(Math.random()-0.5)*160,y:-120},
        {x:aim+(Math.random()-0.5)*80,y:-400}
      ];
    }
    e.state='DIVE';
    e.t=0;
    e.dur=(cfg.dive||1.5)*(opts.slow||1)*(0.9+Math.random()*0.25);
    e.spiral=opts.spiral?1:0;
    if(cfg.beam&&e.def.boss) e.willBeam=true;
  }
  switch(cfg.mode){
    case 'single':
      doDive(pick());
      break;
    case 'pair': {
      var a=pick(), b=pick();
      if(b===a) b=pool[(pool.indexOf(a)+1)%pool.length];
      doDive(a); doDive(b);
      break;
    }
    case 'row': {
      var y0=pool[0].fy, row=[];
      for(var r=0;r<pool.length;r++) if(Math.abs(pool[r].fy-y0)<6) row.push(pool[r]);
      for(var rr=0;rr<row.length;rr++) doDive(row[rr],{row:1,slow:1.25,aim:player.x});
      break;
    }
    case 'boss': {
      var bosses=[],rest=[];
      for(var bb=0;bb<pool.length;bb++){ (pool[bb].def.boss?bosses:rest).push(pool[bb]); }
      if(bosses.length){
        doDive(bosses[(Math.random()*bosses.length)|0]);
        if(rest.length) doDive(rest[(Math.random()*rest.length)|0]);
        if(rest.length>1) doDive(rest[(Math.random()*rest.length)|0]);
      } else { doDive(pick()); doDive(pick()); }
      break;
    }
    case 'spiral': {
      var sa=pick(), sb=pick();
      if(sb===sa) sb=pool[(pool.indexOf(sa)+1)%pool.length];
      doDive(sa,{spiral:1});
      doDive(sb,{spiral:1});
      break;
    }
    case 'triple':
      for(var k=0;k<3;k++) doDive(pick());
      break;
    case 'swarm':
      for(var k2=0;k2<5;k2++) doDive(pick());
      break;
  }
  G.attackT=cfg.atk*(0.7+Math.random()*0.6);
  if(Math.random()<0.55) sound.divingSound();
}
/* ================= ENEMY FIRE (per-level bullet patterns) ================= */
function enemyFire(dt){
  var cfg=cfgLevel();
  if(!cfg.fire) return; /* bonus stage: enemies never shoot */
  G.fireT-=dt;
  if(G.fireT>0) return;
  var interval=(cfg.fire==='spread')?0.85:((cfg.fire==='aim')?1.0:1.25);
  G.fireT=interval*(0.75+Math.random()*0.5);
  var pool=[];
  for(var i=0;i<enemies.length;i++){
    if(enemies[i].state==='FORM'||enemies[i].state==='DIVE') pool.push(enemies[i]);
  }
  if(!pool.length||ebullets.length>24) return;
  var e=pool[(Math.random()*pool.length)|0];
  var dx=player.x-e.x, dy=PLAYER_Y-e.y;
  var d=Math.sqrt(dx*dx+dy*dy)||1;
  var nx=dx/d, ny=dy/d;
  if(e.def.mine&&Math.random()<0.5){
    spawnBullet(e.x,e.y-8,0,130,true);                 /* wobbly slow mine */
  } else if(cfg.fire==='down'){
    spawnBullet(e.x+(Math.random()-0.5)*6,e.y-10,0,250,false); /* straight down */
  } else if(cfg.fire==='aim'){
    spawnBullet(e.x,e.y-10,nx*320,ny*320,false);        /* aimed plasma */
  } else {
    var base=Math.atan2(ny,nx);
    for(var k=-1;k<=1;k++){
      var a=base+k*0.35;                                /* 3-way bullet-hell spread */
      spawnBullet(e.x,e.y-10,Math.cos(a)*300,Math.sin(a)*300,false);
    }
  }
}
/* ================= BOSS TRACTOR BEAM (capture cone + particle funnel) ================= */
var beam={on:false,group:null,cyl:null,mat:null,pgeo:null,pmat:null,pvel:[],n:0,owner:null,len:0};
function makeBeam(){
  var g=new THREE.Group();
  var cyl=new THREE.Mesh(
    new THREE.CylinderGeometry(6,26,1,16,1,true),
    new THREE.MeshBasicMaterial({color:0x3ef5f5,transparent:true,opacity:0.14,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));
  var n=60, pos=new Float32Array(n*3), vel=[];
  for(var i=0;i<n;i++){
    pos[i*3]=(Math.random()-0.5)*12;
    pos[i*3+1]=-Math.random();
    pos[i*3+2]=0;
    vel.push(60+Math.random()*90);
  }
  var pg=new THREE.BufferGeometry();
  pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  var pm=new THREE.PointsMaterial({size:4,color:0x9ff7ff,transparent:true,opacity:0.85,blending:THREE.AdditiveBlending,depthWrite:false,map:dotTex});
  var pp=new THREE.Points(pg,pm);
  g.add(cyl);
  g.add(pp);
  scene.add(g);
  beam.group=g; beam.cyl=cyl; beam.mat=cyl.material; beam.pgeo=pg; beam.pmat=pm; beam.pvel=vel; beam.n=n;
}
function startBeam(e){
  if(!beam.group) makeBeam();
  beam.on=true;
  beam.owner=e;
  beam.group.visible=true;
  sound.beamStart();
}
function endBeam(){
  if(!beam.on) return;
  beam.on=false;
  beam.owner=null;
  if(beam.group) beam.group.visible=false;
  G.beamCap=0;
  sound.beamStop();
}
function updateBeam(dt){
  if(!beam.on||!beam.owner) return;
  var e=beam.owner;
  var len=Math.max(60,e.y+340);
  beam.len=len;
  beam.group.position.set(e.x,e.y,2);
  beam.cyl.scale.y=len;
  beam.cyl.position.y=-len/2;
  beam.cyl.rotation.y+=dt*2.5;
  beam.mat.opacity=0.10+0.08*(0.5+0.5*Math.sin(G.time*7));
  var p=beam.pgeo.attributes.position;
  for(var i=0;i<beam.n;i++){
    var y=p.getY(i)-beam.pvel[i]*dt;
    if(y<-len) y=0;
    p.setY(i,y);
  }
  p.needsUpdate=true;
}
function disposeBeam(){
  if(beam.on) endBeam();
  if(beam.group){
    scene.remove(beam.group);
    beam.group.traverse(function(o){
      if(o.geometry) o.geometry.dispose();
      if(o.material) o.material.dispose();
    });
    beam.group=null; beam.cyl=null; beam.mat=null; beam.pgeo=null; beam.pmat=null;
  }
}

/* ================= PARTICLE EFFECTS (THREE.Points bursts, disposed on death) ================= */
function burst(x,y,color,count,spd,life,size){
  var pos=new Float32Array(count*3), vel=[];
  for(var i=0;i<count;i++){
    pos[i*3]=x; pos[i*3+1]=y; pos[i*3+2]=0.5;
    var a=Math.random()*6.283;
    var v=spd*(0.25+Math.random());
    vel.push(Math.cos(a)*v,Math.sin(a)*v);
  }
  var geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  var m=new THREE.PointsMaterial({size:size,color:color,transparent:true,opacity:1,depthWrite:false,map:dotTex});
  var pts=new THREE.Points(geo,m);
  scene.add(pts);
  bursts.push({pts:pts,geo:geo,mat:m,vel:vel,count:count,t:0,life:life});
}
function updateBursts(dt){
  for(var i=bursts.length-1;i>=0;i--){
    var b=bursts[i];
    b.t+=dt;
    var k=1-b.t/b.life;
    if(k<=0){
      scene.remove(b.pts);
      b.geo.dispose();
      b.mat.dispose();
      bursts.splice(i,1);
      continue;
    }
    var p=b.geo.attributes.position;
    var damp=Math.max(0,1-1.8*dt);
    for(var j=0;j<b.count;j++){
      p.setX(j,p.getX(j)+b.vel[j*2]*dt);
      p.setY(j,p.getY(j)+b.vel[j*2+1]*dt);
      b.vel[j*2]*=damp;
      b.vel[j*2+1]*=damp;
    }
    p.needsUpdate=true;
    b.mat.opacity=k;
  }
}
function clearBursts(){
  for(var i=0;i<bursts.length;i++){
    scene.remove(bursts[i].pts);
    bursts[i].geo.dispose();
    bursts[i].mat.dispose();
  }
  bursts.length=0;
}
/* Continuous player thruster emitter (recycled particle pool) */
var TH_N=90;
var thrGeo=new THREE.BufferGeometry();
var thrPos=new Float32Array(TH_N*3);
var thrVel=[],thrLife=[];
for(var ti=0;ti<TH_N;ti++){
  thrVel.push(0); thrLife.push(0);
  thrPos[ti*3]=0; thrPos[ti*3+1]=0; thrPos[ti*3+2]=-999;
}
thrGeo.setAttribute('position',new THREE.BufferAttribute(thrPos,3));
var thrPts=new THREE.Points(thrGeo,new THREE.PointsMaterial({size:3.5,color:0x9fe8ff,transparent:true,opacity:0.75,blending:THREE.AdditiveBlending,depthWrite:false,map:dotTex}));

var thrIdx=0;
function thruster(dt){
  if(player.alive){
    for(var s=0;s<2;s++){
      var i=thrIdx; thrIdx=(thrIdx+1)%TH_N;
      thrPos[i*3]=player.x+(Math.random()-0.5)*6;
      thrPos[i*3+1]=PLAYER_Y+16+(Math.random()-0.5)*3;
      thrPos[i*3+2]=0.5;
      thrVel[i]=70+Math.random()*90;
      thrLife[i]=0.28+Math.random()*0.2;
    }
  }
  for(var j=0;j<TH_N;j++){
    if(thrLife[j]>0){
      thrLife[j]-=dt;
      if(thrLife[j]<=0) thrPos[j*3+2]=-999;
      else thrPos[j*3+1]+=thrVel[j]*dt;
    }
  }
  thrGeo.attributes.position.needsUpdate=true;
}

SoundEngine.prototype.hitSound=function(){
  if(!this.ensure()) return;
  var t=this.ctx.currentTime;
  var src=this.ctx.createBufferSource(); src.buffer=this._noise; src.loop=true;
  var f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1400;
  var g=this.ctx.createGain();
  g.gain.setValueAtTime(0.18,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.08);
  src.connect(f); f.connect(g); g.connect(this.master);
  src.start(t); src.stop(t+0.1);
};

function damageEnemy(j){
  var e=enemies[j];
  e.hp--;
  if(e.hp>0){
    e.flash=0.15;                       /* armored hit: flash & survive */
    sound.hitSound();
    return;
  }
  var diving=(e.state==='DIVE');
  addScore(e.def.pts*(diving?2:1));     /* diving enemies pay double */
  burst(e.x,e.y,e.def.color,(e.def.boss?26:16),(e.def.boss?150:110),(e.def.boss?0.85:0.55),(e.def.boss?6:4.5));
  burst(e.x,e.y,0xffffff,8,90,0.35,3);
  sound.explosionSound(e.def.boss?'big':'small');
  if(e.def.split){
    /* Splitter: spawns two fast mini-craft that dart away */
    for(var k=0;k<2;k++){
      var side=k?-1:1;
      var m=spawnEnemy('MINI',e.x+side*10,e.y,0);
      m.state='DIVE';
      m.t=0;
      m.dur=0.9;
      m.noReturn=true;
      m.path=[
        {x:e.x,y:e.y},
        {x:e.x+side*90,y:e.y-120},
        {x:e.x+side*140,y:e.y-320},
        {x:e.x+side*170,y:-420}
      ];
    }
  }
  if(beam.owner===e) endBeam();
  removeEnemy(j);
  if(G.state==='PLAYING'&&enemies.length===0) stageClear();
}
function collisions(){
  /* Player lasers vs enemies */
  for(var i=lasers.length-1;i>=0;i--){
    var L=lasers[i];
    var hit=false;
    for(var j=enemies.length-1;j>=0;j--){
      var e=enemies[j];
      if(e.state==='CAPTURE') continue;
      var dx=e.x-L.x, dy=e.y-L.y;
      var rr=e.def.r+5;
      if(dx*dx+dy*dy<rr*rr){
        damageEnemy(j);
        hit=true;
        break;
      }
    }
    if(hit){ scene.remove(L.group); lasers.splice(i,1); }
  }
  if(G.state!=='PLAYING') return;
  if(!player.alive||player.invuln>0) return;
  /* Enemy bullets vs player */
  var pr=PLAYER_R+5;
  for(var k=ebullets.length-1;k>=0;k--){
    var b=ebullets[k];
    var ddx=b.x-player.x, ddy=b.y-PLAYER_Y;
    if(ddx*ddx+ddy*ddy<pr*pr){
      scene.remove(b.group);
      ebullets.splice(k,1);
      hitPlayer();
      return;
    }
  }
  /* Diving enemy bodies vs player */
  for(var m2=enemies.length-1;m2>=0;m2--){
    var en=enemies[m2];
    if(en.state!=='DIVE') continue;
    var ex=en.x-player.x, ey=en.y-PLAYER_Y;
    var rr2=en.def.r+10;
    if(ex*ex+ey*ey<rr2*rr2){ hitPlayer(); break; }
  }
}

  if(!player.alive) return;
  burst(player.x,PLAYER_Y,0xffffff,24,150,0.8,5);
  burst(player.x,PLAYER_Y,0xff5a3c,16,110,0.9,4);
  sound.explosionSound('big');

var gpPrev={confirm:false,start:false,mute:false};
var gpOn=false;
/* status line (menu) — LIVE per-frame readout of EVERY connected pad so you
   can watch exactly which button indices report pressed */
function gpStat(text,active){
  var el=document.getElementById('gpStat');
  if(!el) return;
  el.style.whiteSpace='pre';
  if(el._t!==text){
    el._t=text;
    el.textContent=text;

function sampleGamepad(){
  padMove=0; padFire=false;
  var pads=null;
  try{ pads=navigator.getGamepads?navigator.getGamepads():null; }catch(err){ pads=null; }
  var entries=[];
  if(pads){
    for(var i=0;i<pads.length;i++){
      var p=pads[i];
      if(!p||!p.connected) continue;
      var pb=p.buttons||[], pa=p.axes||[];
      var pressed=[], btnStr='', any=false;
      for(var bi=0;bi<pb.length;bi++){
        var bt=pb[bi];
        var on=!!(bt&&(bt.pressed||(bt.value||0)>0.5));
        pressed[bi]=on;
        if(on) any=true;
        btnStr+=on?'1':'0';
      }
      entries.push({id:String(p.id||('slot '+i)), pressed:pressed, axes:pa, any:any, btnStr:btnStr, n:pb.length, na:pa.length});
    }
  }
  if(!entries.length){
    if(gpOn){ gpOn=false; gpStat('GAMEPAD: NONE DETECTED',false); }
    gpPrev={confirm:false,start:false,mute:false};
    return;
  }
  if(!gpOn) gpOn=true;
  try{ sound.ensure(); }catch(err){}
  /* MERGE input from EVERY connected pad — this machine enumerates two
     devices (a Razer "Unknown Gamepad" 24b/10ax AND a "STANDARD GAMEPAD"
     16b/0ax); reading only one slot left the other pad completely dead.
     accept BOTH .pressed and .value>0.5 (some stacks only report value). */
  var b=function(i){
    for(var k=0;k<entries.length;k++){ if(entries[k].pressed[i]) return true; }
    return false;
  };
  var ax=function(idx){
    var v=0;
    for(var k=0;k<entries.length;k++){
      var a=entries[k].axes[idx];
      if(a===undefined) continue;
      if(Math.abs(a)>Math.abs(v)) v=a;
    }
    return v;
  };
  var dz=0.22;
  var s=ax(0);
  if(Math.abs(s)<dz) s=0;
  var ah=ax(3);   /* standard mapping: horizontal D-pad on axis 3 */
  if(Math.abs(ah)>0.5) s+=(ah>0?1:-1);
  if(b(14)) s-=1;  /* D-pad left  */
  if(b(15)) s+=1;  /* D-pad right */
  padMove=(s<0)?-1:((s>0)?1:0);
  /* fire: A(0) / X(2) / B(5) / right trigger(7) — covers standard AND the
     common Razer layout where A=2 */
  padFire=!!(b(0)||b(2)||b(5)||b(7));
  /* confirm (edge-triggered): A / X / B / START start from menu / game-over / victory */
  var cf=b(9)||b(0)||b(2)||b(5);
  if(cf&&!gpPrev.confirm){
    if(G.state==='MENU'||G.state==='GAME_OVER'||G.state==='VICTORY') startGame();
  }
  /* pause is START (9) ONLY — the fire buttons (A/X/B) must never pause mid-play */
  var ps=b(9);
  if(ps&&!gpPrev.start) togglePause();
  if(b(8)&&!gpPrev.mute) toggleMute();  /* Back = mute */
  gpPrev={confirm:cf,start:ps,mute:b(8)};
  /* live debug: full per-pad button state (1 = pressed) */
  var dbg='', anyPad=false;
  for(var m=0;m<entries.length;m++){
    var e=entries[m];
    if(e.any) anyPad=true;
    var ruler=(e.n>16)?'0123456789ABCDEF0123 ':'0123456789ABCDEF';
    dbg+='PAD'+(m+1)+'  '+e.id.slice(0,26)+'  ['+e.n+'b/'+e.na+'ax]\n   '+ruler+e.btnStr+'\n';
  }
  dbg+=anyPad?'MERGED -> MOVE:'+(padMove||0)+' FIRE:'+(padFire?1:0)+'   (buttons are registering!)'
             :'MERGED -> MOVE:0 FIRE:0   [press any button on either pad to see it flip to 1]';
  gpStat(dbg,true);
}

});

var joyVis=0, fireDown=false;
/* Drive the physical stick/knob visual to a value in [-1,1].
   Called for touch input AND mirrored from keyboard / gamepad every frame. */
function joySet(x){
  x=clamp(x,-1,1);
  if(joyVis===x) return;
  joyVis=x;
  if(x===0){
    joyBase.classList.remove('active');
    joyKnob.style.transform='translate(0px,0px)';
    joyStick.style.transform='rotate(0deg) scaleY(0)';
    return;
  }
  joyBase.classList.add('active');
  var r=joyBase.getBoundingClientRect();
  var kr=joyKnob.getBoundingClientRect();
  var max=Math.max(4,r.width/2-kr.width/2);
  var d=x*max*0.75;
  joyKnob.style.transform='translate('+d+'px,0px)';
  /* the metal pole points from the base center toward the knob */
  joyStick.style.transform='rotate('+(x>0?90:270)+'deg) scaleY(0.75)';
}
function joyApply(clientX){
  var r=joyBase.getBoundingClientRect();
  var cx=r.left+r.width/2;

  joySet(joyX);
}

function updatePlayer(dt){
  if(!player.alive){

      player.respawnT-=dt;
      if(player.respawnT<=0){
        player.alive=true;
        player.x=0;
        player.invuln=2.2;
        player.group.visible=true;
        player.group.position.set(0,PLAYER_Y,3);
      }
    }
    return;
  }
  if(drag.active){
    player.x+=(drag.wx-player.x)*Math.min(1,dt*16);   /* smooth glide toward finger */
  } else {
    player.x+=mvInput()*PLAYER_SPEED*dt;
  }
  player.x=clamp(player.x,-HW+18,HW-18);
  player.group.position.set(player.x,PLAYER_Y,3);
  if(player.invuln>0){
    player.invuln-=dt;
    player.group.visible=Math.sin(G.time*28)>-0.2;    /* respawn invulnerability flicker */
  } else {
    player.group.visible=true;
  }
  thruster(dt);
  G.fireCd-=dt;
  if(fireHeld()&&G.fireCd<=0&&lasers.length<MAX_LASERS){
    G.fireCd=FIRE_CD;
    spawnLaser();

/* ================= MAIN LOOP (delta-time integrated) ================= */
function tick(dt){
  G.time+=dt;
  updateStars(dt);
  sampleGamepad();
  var st=G.state;
  if(st==='STAGE_INTRO'){
    G.introT-=dt;
    if(G.introT<=0){
      G.state='PLAYING';
      buildFormation();
      renderOverlay('PLAYING');
    }
    return;
  }
  if(st==='CLEAR'){
    G.clearT-=dt;
    if(G.clearT<=0) afterClear();
    return;
  }
  if(st==='DYING'){
    G.dyingT-=dt;
    if(G.dyingT<=0){
      G.state='GAME_OVER';
      renderOverlay('GAME_OVER');
    }
    return;
  }
  if(st!=='PLAYING') return;   /* MENU / PAUSED / GAME_OVER / VICTORY: scene idles */
  updatePlayer(dt);
  director(dt);
  enemyFire(dt);
  updateEnemies(dt);
  updateLasers(dt);
  updateBullets(dt);
  updateBeam(dt);
  collisions();
}
function loop(){
  requestAnimationFrame(loop);
  var dt=Math.min(clock.getDelta(),0.05);   /* clamp: stable at 60/120/144Hz */
  tick(dt);
  mirrorPads();                             /* sync stick + FIRE button to kb / gamepad / touch */
  updateBursts(dt);
  renderer.render(scene,camera);
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&G.state==='PLAYING') togglePause();
});
/* ================= BOOT ================= */
player.group=buildPlayer();
player.group.position.set(0,PLAYER_Y,3);
player.group.visible=false;
scene.add(player.group);
updateHUD();
renderOverlay('MENU');
loop();
})();
</script>
</body>
